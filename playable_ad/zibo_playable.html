<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zibo — Küçük Adımlar</title>
<style>
  /* Zibo playable — tek dosya, sıfır dış kaynak. Sıcak gündüz dünyası:
     bilerek tek tema (bir reklam creative'i, viewer teması yok). */
  :root{
    --cream:#FFF8E8; --paper:#FBF1DA; --honey:#EFCB7A; --honey-deep:#F4E1B4;
    --mustard:#A9711F; --mustard-bright:#C98A2E;
    --espresso:#4A3620; --espresso-soft:#7A5C34;
    --sand:#DCC28A; --win:#1E9F49; --glow:#00E676; --terracotta:#B5502A;
    --display:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    --ui:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    --warmth:0; /* 0 (yorgun) -> 1 (parlak); ilerlemeyle artar */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#EAD9AE;font-family:var(--ui);
    color:var(--espresso);-webkit-user-select:none;user-select:none;touch-action:manipulation}

  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% -10%,
        color-mix(in srgb, #FFE7A8 calc(var(--warmth)*100%), #CFC6AE) 0%,
        color-mix(in srgb, var(--cream) calc(var(--warmth)*100%), #C7BE9F) 60%,
        color-mix(in srgb, var(--honey-deep) calc(var(--warmth)*100%), #BBB08C) 100%);
    transition:background .8s ease}

  /* --- gökyüzü öğeleri --- */
  #sun{position:absolute;top:-14vmin;left:50%;width:46vmin;height:46vmin;border-radius:50%;
    background:radial-gradient(circle at 50% 50%, #FFF6DE 0%, #FFD873 45%, rgba(255,216,115,0) 72%);
    transform:translate(-50%, calc(-8vmin + var(--warmth) * 12vmin)) scale(calc(.55 + var(--warmth)*.6));
    opacity:calc(.15 + var(--warmth)*.85);transition:transform .8s ease, opacity .8s ease;
    pointer-events:none}
  #cloud{position:absolute;top:8vmin;left:50%;transform:translateX(-58%);width:34vmin;height:16vmin;
    opacity:calc(1 - var(--warmth));transition:opacity .6s ease;pointer-events:none;
    filter:drop-shadow(0 6px 0 rgba(74,54,32,.08))}
  #cloud::before,#cloud::after{content:"";position:absolute;background:#B9AE93;border-radius:50%}
  #cloud::before{width:22vmin;height:14vmin;left:0;bottom:0}
  #cloud::after{width:16vmin;height:16vmin;right:0;bottom:1vmin}
  .rain{position:absolute;left:50%;top:22vmin;transform:translateX(-58%);width:30vmin;height:20vmin;
    opacity:calc(1 - var(--warmth));transition:opacity .5s ease;pointer-events:none}
  .rain i{position:absolute;width:.5vmin;height:2.6vmin;border-radius:1vmin;background:#9FB0C4;
    animation:drop 1.1s linear infinite}
  @keyframes drop{0%{transform:translateY(-4vmin);opacity:0}20%{opacity:.9}100%{transform:translateY(16vmin);opacity:0}}

  /* --- üst bar --- */
  header{position:relative;z-index:6;width:100%;max-width:640px;display:flex;justify-content:space-between;
    align-items:center;padding:max(14px,env(safe-area-inset-top)) 16px 4px}
  #coins{display:flex;align-items:center;gap:7px;background:var(--paper);border:2px solid var(--sand);
    border-radius:999px;padding:5px 13px 5px 7px;font-family:var(--display);font-weight:700;
    font-size:17px;color:var(--mustard);box-shadow:0 3px 0 rgba(74,54,32,.12)}
  #coins img{width:24px;height:24px;display:block}
  #coinCount{font-variant-numeric:tabular-nums;min-width:1.4ch;text-align:left}
  #skip{background:transparent;border:0;font-family:var(--ui);font-weight:700;font-size:14px;
    color:var(--espresso-soft);padding:8px 10px;border-radius:10px;letter-spacing:.02em}
  #skip:active{background:rgba(74,54,32,.08)}

  /* --- Zibo + halka --- */
  #ziboWrap{position:relative;z-index:5;flex:1 1 auto;display:flex;align-items:center;justify-content:center;
    width:100%;min-height:0}
  #ringSvg{position:absolute;width:min(74vw,300px);height:min(74vw,300px);max-height:44vh;
    transform:rotate(-90deg);overflow:visible}
  #ringTrack{fill:none;stroke:rgba(74,54,32,.12);stroke-width:9}
  #ringFill{fill:none;stroke:url(#ringGrad);stroke-width:9;stroke-linecap:round;
    stroke-dasharray:var(--circ);stroke-dashoffset:var(--circ);
    transition:stroke-dashoffset .7s cubic-bezier(.34,1.4,.5,1)}
  #zibo{position:relative;width:auto;height:min(40vh,290px);
    filter:saturate(calc(.6 + var(--warmth)*.5)) brightness(calc(.96 + var(--warmth)*.06))
    drop-shadow(0 14px 16px rgba(74,54,32,.22));
    transition:filter .7s ease;animation:bob 2.6s ease-in-out infinite}
  #zibo.pop{animation:pop .55s cubic-bezier(.3,1.5,.5,1)}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-2.4%) rotate(.6deg)}}
  @keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.12,.9)}55%{transform:scale(.95,1.08)}100%{transform:scale(1)}}

  #bubble{position:absolute;z-index:7;top:2%;left:50%;transform:translateX(-50%) translateX(4vmin);
    background:var(--paper);border:2.5px solid var(--espresso);border-radius:16px;
    padding:8px 13px;font-family:var(--display);font-weight:700;font-size:clamp(13px,3.6vw,17px);
    color:var(--espresso);white-space:nowrap;box-shadow:0 4px 0 rgba(74,54,32,.16);
    opacity:0;transition:opacity .25s ease, transform .25s ease}
  #bubble.show{opacity:1}
  #bubble::after{content:"";position:absolute;left:24%;bottom:-11px;width:16px;height:16px;
    background:var(--paper);border-right:2.5px solid var(--espresso);border-bottom:2.5px solid var(--espresso);
    transform:rotate(45deg)}

  /* --- görev bölgesi --- */
  #taskZone{position:relative;z-index:5;width:100%;max-width:520px;padding:0 20px
    calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:14px}
  #taskTitle{font-family:var(--display);font-weight:700;font-size:clamp(17px,4.6vw,22px);
    color:var(--espresso);text-align:center;text-wrap:balance;line-height:1.15;
    min-height:1.2em}
  #targets{display:flex;align-items:flex-end;justify-content:center;gap:clamp(14px,5vw,30px);
    min-height:clamp(96px,26vw,132px)}

  .tap{position:relative;cursor:pointer;transition:transform .12s ease}
  .tap:active{transform:scale(.92)}

  /* su bardağı */
  .glass{width:clamp(64px,17vw,86px);height:clamp(84px,22vw,112px);border:4px solid var(--espresso);
    border-top:none;border-radius:6px 6px 16px 16px;overflow:hidden;background:rgba(255,255,255,.5)}
  .glass .fill{position:absolute;left:0;right:0;bottom:0;height:0;
    background:linear-gradient(#7FC6E8,#4FA8D8);transition:height .35s cubic-bezier(.34,1.3,.6,1)}
  .glass .fill::after{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:rgba(255,255,255,.55)}

  /* şükran kalpleri */
  .heart{width:clamp(46px,12vw,60px);height:clamp(46px,12vw,60px);
    background:var(--mustard-bright);
    -webkit-mask:radial-gradient(circle at 30% 32%, #000 22%, transparent 23%) 0 0/50% 50% no-repeat,
      radial-gradient(circle at 70% 32%, #000 22%, transparent 23%) 100% 0/50% 50% no-repeat,
      linear-gradient(#000,#000) bottom/70% 62% no-repeat;
    mask:radial-gradient(circle at 30% 32%, #000 22%, transparent 23%) 0 0/50% 50% no-repeat,
      radial-gradient(circle at 70% 32%, #000 22%, transparent 23%) 100% 0/50% 50% no-repeat,
      linear-gradient(#000,#000) bottom/70% 62% no-repeat;
    filter:drop-shadow(0 4px 0 rgba(74,54,32,.18));animation:floaty 2.4s ease-in-out infinite}
  .heart:nth-child(2){animation-delay:-.8s}
  .heart:nth-child(3){animation-delay:-1.6s}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .tap.gone{pointer-events:none;opacity:0;transform:scale(1.6) rotate(12deg);transition:all .3s ease}

  /* hedef kutusu */
  .checkbox{width:clamp(88px,24vw,116px);height:clamp(88px,24vw,116px);border:5px solid var(--espresso);
    border-radius:20px;background:var(--paper);display:flex;align-items:center;justify-content:center;
    box-shadow:0 5px 0 rgba(74,54,32,.16)}
  .checkbox svg{width:64%;height:64%}
  .checkbox path{fill:none;stroke:var(--win);stroke-width:14;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:120;stroke-dashoffset:120;transition:stroke-dashoffset .4s ease .05s}
  .checkbox.done{background:#E8F6EC;border-color:var(--win)}
  .checkbox.done path{stroke-dashoffset:0}

  .hint{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;
    border:3px solid var(--espresso);opacity:.0;pointer-events:none;
    animation:hint 1.6s ease-out infinite}
  @keyframes hint{0%{transform:scale(.5);opacity:.55}70%{opacity:0}100%{transform:scale(2.1);opacity:0}}

  /* ekran flaş + sarsıntı */
  #flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%, #FFEFC2, rgba(255,239,194,0) 70%);
    opacity:0;pointer-events:none;z-index:9}
  #flash.go{animation:flash .45s ease-out}
  @keyframes flash{0%{opacity:0}25%{opacity:.9}100%{opacity:0}}
  #stage.shake{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

  #fx{position:fixed;inset:0;pointer-events:none;z-index:8}

  /* --- seviye rozeti --- */
  #levelBadge{position:absolute;z-index:9;left:50%;top:38%;transform:translate(-50%,-50%) scale(0);
    background:linear-gradient(150deg,#FFDD8A,#E7A233);border:3px solid var(--espresso);
    border-radius:16px;padding:9px 18px;font-family:var(--display);font-weight:700;font-size:20px;
    color:var(--espresso);box-shadow:0 6px 0 rgba(74,54,32,.22),0 0 0 6px rgba(255,255,255,.35);
    letter-spacing:.04em}
  #levelBadge.show{animation:badgePop .7s cubic-bezier(.3,1.6,.5,1) forwards}
  @keyframes badgePop{0%{transform:translate(-50%,-50%) scale(0) rotate(-14deg)}
    60%{transform:translate(-50%,-50%) scale(1.15) rotate(4deg)}
    100%{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}}

  /* --- son kart --- */
  #endCard{position:fixed;inset:0;z-index:12;background:
      radial-gradient(120% 70% at 50% 0%, #FFE7A8 0%, var(--cream) 55%, var(--honey-deep) 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 26px calc(26px + env(safe-area-inset-bottom));text-align:center;
    transform:translateY(100%);transition:transform .55s cubic-bezier(.4,1.2,.5,1)}
  #endCard.show{transform:translateY(0)}
  #endCard .ecZibo{height:min(34vh,240px);width:auto;filter:drop-shadow(0 16px 18px rgba(74,54,32,.25));
    animation:bob 2.6s ease-in-out infinite}
  #endCard h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,7vw,34px);
    color:var(--mustard);line-height:1.08;text-wrap:balance;margin-top:6px}
  #endCard p{font-size:clamp(14px,3.8vw,16px);color:var(--espresso-soft);max-width:32ch;
    line-height:1.4;margin-top:10px}
  #stars{display:flex;align-items:center;gap:8px;margin-top:12px;font-family:var(--display);
    font-weight:700;color:var(--espresso);font-size:14px}
  #stars .s{color:#E7A233;letter-spacing:2px;font-size:17px}
  #cta{margin-top:20px;border:0;cursor:pointer;font-family:var(--display);font-weight:700;
    font-size:clamp(18px,5vw,22px);letter-spacing:.06em;color:#08331A;
    background:linear-gradient(180deg,#57E58C,#1FA34A);
    padding:16px 40px;border-radius:999px;
    box-shadow:0 6px 0 #0E7C37, 0 0 0 0 rgba(0,230,118,.55);
    animation:ctaPulse 1.8s ease-in-out infinite}
  #cta:active{transform:translateY(3px);box-shadow:0 3px 0 #0E7C37}
  @keyframes ctaPulse{0%,100%{box-shadow:0 6px 0 #0E7C37, 0 0 0 0 rgba(0,230,118,.5)}
    50%{box-shadow:0 6px 0 #0E7C37, 0 0 0 16px rgba(0,230,118,0)}}
  #endCard .tagline{margin-top:14px;font-size:12px;color:var(--espresso-soft);opacity:.8;
    letter-spacing:.03em}

  @media (prefers-reduced-motion: reduce){
    #zibo,#endCard .ecZibo,.heart{animation:none}
    #cta{animation:none;box-shadow:0 6px 0 #0E7C37}
    #flash.go,#stage.shake{animation-duration:.01ms}
    #ringFill{transition-duration:.2s}
  }
  /* çok geniş / yatay: sahneyi ortala, aşırı büyümesin */
  @media (min-aspect-ratio:1/1){
    #zibo{height:min(52vh,300px)}
    #ringSvg{width:min(52vh,320px);height:min(52vh,320px);max-height:60vh}
    #taskZone{max-width:560px}
  }
</style>
</head>

  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $ = function(s){ return document.querySelector(s); };
  var stage=$("#stage"), zibo=$("#zibo"), bubble=$("#bubble"), title=$("#taskTitle"),
      targets=$("#targets"), coinCountEl=$("#coinCount"), ring=$("#ringFill"),
      flash=$("#flash"), endCard=$("#endCard"), levelBadge=$("#levelBadge"),
      root=document.documentElement;

  var CIRC = 2*Math.PI*54;
  ring.style.setProperty("--circ", CIRC);

  var coins=0, warmth=0, step=0, done=false, idleTimer=null;

  /* ---------- MRAID / ağ köprüsü ---------- */
  function whenReady(cb){
    try{
      if(window.mraid){
        if(typeof mraid.getState==="function" && mraid.getState()!=="loading"){ cb(); return; }
        mraid.addEventListener("ready", cb); return;
      }
    }catch(e){}
    cb();
  }
  var stored=false;
  function goToStore(){
    if(stored) return; stored=true;
    var tries=[
      function(){ if(window.mraid && typeof mraid.open==="function"){ mraid.open(STORE); return true; } },
      function(){ if(window.FbPlayableAd && typeof FbPlayableAd.onCTAClick==="function"){ FbPlayableAd.onCTAClick(); return true; } },
      function(){ if(window.ExitApi && typeof ExitApi.exit==="function"){ ExitApi.exit(); return true; } },
      function(){ if(window.dapi && typeof dapi.openStoreUrl==="function"){ dapi.openStoreUrl(); return true; } },
      function(){ if(window.mraidbridge && typeof mraidbridge.notifyExposureChange==="function" && typeof mraid!=="undefined"){ mraid.open(STORE); return true; } },
      function(){ window.open(STORE,"_blank"); return true; },
      function(){ top.location.href = STORE; return true; }
    ];
    for(var i=0;i<tries.length;i++){ try{ if(tries[i]()) return; }catch(e){} }
  }

  /* ---------- yardımcılar ---------- */
  function setWarmth(v){ warmth=Math.max(0,Math.min(1,v)); root.style.setProperty("--warmth", warmth.toFixed(3)); }
  function setRing(frac){ ring.style.strokeDashoffset = CIRC*(1-Math.max(0,Math.min(1,frac))); }
  function say(t){ bubble.textContent=t; bubble.classList.add("show"); }
  function hideBubble(){ bubble.classList.remove("show"); }

  function popZibo(){ zibo.classList.remove("pop"); void zibo.offsetWidth; zibo.classList.add("pop"); }
  function doFlash(){ if(reduce) return; flash.classList.remove("go"); void flash.offsetWidth; flash.classList.add("go");
    stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake"); }

  function addCoins(n, fromEl){
    spawnCoins(fromEl);
    var target=coins+n, startT=performance.now(), from=coins;
    function tick(t){
      var k=Math.min(1,(t-startT)/650);
      coinCountEl.textContent = Math.round(from+(target-from)*k);
      if(k<1) requestAnimationFrame(tick); else coins=target;
    }
    requestAnimationFrame(tick);
  }

  /* ---------- canvas efektleri ---------- */
  var cv=$("#fx"), cx=cv.getContext("2d"), parts=[], raf=null, DPR=Math.min(2,window.devicePixelRatio||1);
  function sizeCanvas(){ cv.width=innerWidth*DPR; cv.height=innerHeight*DPR; cx.setTransform(DPR,0,0,DPR,0,0); }
  sizeCanvas(); addEventListener("resize", function(){ sizeCanvas(); });

  function loop(){
    cx.clearRect(0,0,innerWidth,innerHeight);
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.life--; p.rot+=p.vr;
      if(p.target){
        var dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy);
        p.vx+=dx/d*0.9; p.vy+=dy/d*0.9; p.vx*=0.9; p.vy*=0.9;
        if(d<14){ parts.splice(i,1); continue; }
      }
      if(p.life<=0 || p.y>innerHeight+40){ parts.splice(i,1); continue; }
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.globalAlpha=Math.max(0,Math.min(1,p.life/18));
      if(p.coin){
        cx.fillStyle="#E7A233"; cx.beginPath(); cx.arc(0,0,p.r,0,7); cx.fill();
        cx.fillStyle="#FFDD8A"; cx.beginPath(); cx.arc(-p.r*0.25,-p.r*0.25,p.r*0.4,0,7); cx.fill();
      }else{
        cx.fillStyle=p.c; cx.fillRect(-p.r,-p.r*0.6,p.r*2,p.r*1.2);
      }
      cx.restore();
    }
    if(parts.length) raf=requestAnimationFrame(loop); else { raf=null; cx.clearRect(0,0,innerWidth,innerHeight); }
  }
  function ensureLoop(){ if(!raf) raf=requestAnimationFrame(loop); }

  function spawnCoins(fromEl){
    var r=(fromEl||zibo).getBoundingClientRect();
    var cc=$("#coins").getBoundingClientRect();
    var n=reduce?4:9;
    for(var i=0;i<n;i++){
      parts.push({x:r.left+r.width/2+(Math.random()-.5)*r.width*.5, y:r.top+r.height*.4,
        vx:(Math.random()-.5)*4, vy:-Math.random()*4-2, g:0.18, r:6+Math.random()*3,
        life:120, rot:0, vr:(Math.random()-.5)*.3, coin:true,
        target:true, tx:cc.left+18, ty:cc.top+cc.height/2, delay:i*30});
    }
    ensureLoop();
  }
  function confetti(big){
    var cols=["#EFCB7A","#A9711F","#00E676","#FFF8E8","#E7A233","#57E58C"];
    var n=reduce?26:(big?150:70);
    for(var i=0;i<n;i++){
      parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.7, y:innerHeight*0.32,
        vx:(Math.random()-.5)*9, vy:-Math.random()*11-4, g:0.34, r:3+Math.random()*4,
        life:60+Math.random()*40, rot:Math.random()*6, vr:(Math.random()-.5)*.5,
        c:cols[i%cols.length]});
    }
    ensureLoop();
  }

  /* ---------- görev akışı ---------- */
  var TASKS=[
    { title:"Zibo'ya bir bardak su ver 💧", build:buildWater },
    { title:"3 güzel şey topla — şükran zamanı 💛", build:buildGratitude },
    { title:"Bugünkü hedefi tamamla ✓", build:buildGoal }
  ];

  function armIdle(fn){
    clearTimeout(idleTimer);
    idleTimer=setTimeout(fn, 4200); // dokunmazsa görevi otomatik bitir
  }

  function completeStep(msg){
    clearTimeout(idleTimer);
    step++;
    setWarmth(step/3);
    setRing(step/3);
    if(step<3){ zibo.src=POSE.happy; }
    popZibo(); doFlash();
    addCoins(10, targets.firstChild || zibo);
    say(msg);
    if(step>=3){ finish(); return; }
    setTimeout(nextTask, 850);
  }

  function nextTask(){
    var t=TASKS[step];
    title.textContent=t.title;
    targets.innerHTML="";
    t.build();
  }

  function buildWater(){
    var glass=document.createElement("div");
    glass.className="tap"; glass.setAttribute("role","button"); glass.setAttribute("aria-label","Su ekle");
    glass.innerHTML='<div class="glass"><div class="fill"></div></div><span class="hint"></span>';
    var fill=glass.querySelector(".fill"); var n=0;
    glass.addEventListener("pointerdown", function(){
      n++; fill.style.height=(n/3*100)+"%";
      splash(glass);
      if(n>=3) completeStep("Oh be! Su gibi aziz ol 💧");
      else armIdle(function(){ n=3; fill.style.height="100%"; completeStep("Oh be! Su gibi aziz ol 💧"); });
    });
    targets.appendChild(glass);
    armIdle(function(){ fill.style.height="100%"; completeStep("Oh be! Su gibi aziz ol 💧"); });
  }
  function splash(el){
    var r=el.getBoundingClientRect();
    for(var i=0;i<5;i++) parts.push({x:r.left+r.width/2+(Math.random()-.5)*20,y:r.top+8,
      vx:(Math.random()-.5)*4,vy:-Math.random()*3-1,g:0.22,r:3,life:22,rot:0,vr:0,c:"#7FC6E8"});
    ensureLoop();
  }

  function buildGratitude(){
    var left=3;
    for(var i=0;i<3;i++){
      var h=document.createElement("div");
      h.className="tap"; h.setAttribute("role","button"); h.setAttribute("aria-label","Güzel bir şey");
      h.innerHTML='<span class="heart"></span>';
      h.addEventListener("pointerdown", function(ev){
        var node=ev.currentTarget;
        if(node.classList.contains("gone")) return;
        node.classList.add("gone"); burst(node);
        left--;
        if(left<=0) completeStep("Küçük şeyler, koca mutluluk 💛");
      });
      targets.appendChild(h);
    }
    armIdle(function(){
      [].forEach.call(targets.children, function(n){ n.classList.add("gone"); });
      completeStep("Küçük şeyler, koca mutluluk 💛");
    });
  }
  function burst(el){
    var r=el.getBoundingClientRect(), cols=["#E7A233","#FFDD8A","#A9711F"];
    for(var i=0;i<9;i++) parts.push({x:r.left+r.width/2,y:r.top+r.height/2,
      vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,g:0.1,r:3+Math.random()*2,
      life:26,rot:Math.random()*6,vr:.4,c:cols[i%3]});
    ensureLoop();
  }

  function buildGoal(){
    var box=document.createElement("div");
    box.className="tap"; box.setAttribute("role","button"); box.setAttribute("aria-label","Hedefi tamamla");
    box.innerHTML='<div class="checkbox"><svg viewBox="0 0 100 100"><path d="M20 52 L42 74 L80 28"/></svg></div><span class="hint"></span>';
    box.addEventListener("pointerdown", function(){
      box.querySelector(".checkbox").classList.add("done");
      zibo.src=POSE.celebrate;
      setTimeout(function(){ completeStep("İşte bu! Söz verdim, tuttum ✓"); }, 260);
    }, { once:true });
    targets.appendChild(box);
    armIdle(function(){
      box.querySelector(".checkbox").classList.add("done");
      zibo.src=POSE.celebrate;
      completeStep("İşte bu! Söz verdim, tuttum ✓");
    });
  }

  /* ---------- final ---------- */
  function finish(){
    if(done) return; done=true;
    clearTimeout(idleTimer);
    zibo.src=POSE.celebrate;
    setWarmth(1); setRing(1);
    hideBubble();
    title.textContent="Günün tamamlandı 🎉";
    targets.innerHTML="";
    levelBadge.classList.add("show");
    confetti(true);
    setTimeout(function(){ confetti(false); }, 500);
    setTimeout(showEndCard, reduce?400:1500);
  }

  function showEndCard(){
    endCard.classList.add("show");
    // Son karttan sonra herhangi bir dokunuş mağazaya götürür.
    setTimeout(function(){
      document.addEventListener("pointerdown", goToStore, { passive:true });
    }, 350);
  }

  /* ---------- olaylar ---------- */
  $("#cta").addEventListener("pointerdown", function(ev){ ev.stopPropagation(); goToStore(); });
  $("#skip").addEventListener("pointerdown", function(){ finish(); });

  document.addEventListener("visibilitychange", function(){
    if(document.hidden) clearTimeout(idleTimer);
  });

  /* ---------- başla ---------- */
  whenReady(function(){
    setRing(0); setWarmth(0);
    setTimeout(function(){ say("Bugün kendime hiç vakit ayırmadım…"); }, 350);
    setTimeout(function(){ hideBubble(); nextTask(); }, 1900);
  });
})();
</script>
</body>
</html>
