<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zibo Tuğla</title>
<!--
  Zibo Tuğla — Oyun Salonu oyunu (Bricks n Balls tarzı; WebView, bkz. docs/game_zibo.md).
  Uygulamada Flutter `GameWebViewScreen` açar, `ZiboBridge` ile konuşur; tarayıcıda DEMO modu.
  Puan: kırılan tuğla × perBrick (varsayılan 1), tavan 400; 1 kez "alttaki sıraları sil" (reklam / Pro bedava).
-->
<style>
  @font-face { font-family: 'Baloo2'; src: url('../../fonts/Baloo2-Variable.ttf') format('truetype'); font-weight: 400 800; }
  @font-face { font-family: 'Nunito'; src: url('../../fonts/Nunito-Variable.ttf') format('truetype'); font-weight: 200 1000; }
  :root { --outline: #14110C; --gold: #F3B23C; --cream: #FFF8E8; --chip: #FFFDF7; --ice: #8FD3FF; --ice-pale: #DDF2FF; --ice-ink: #0E3A5C; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #FFE9B8; color: #2A2115; font-family: 'Nunito', system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
  .overlay { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(255, 244, 222, .84); overflow-y: auto; }
  .overlay[hidden], .btn[hidden] { display: none; }
  .sheet { width: 100%; max-width: 320px; margin: auto; background: var(--cream); border: 3px solid var(--outline); border-radius: 22px; box-shadow: 5px 5px 0 var(--outline); padding: 16px; display: grid; gap: 10px; justify-items: center; text-align: center; }
  .logo { font: 800 32px/1 'Baloo2', sans-serif; color: var(--gold); -webkit-text-stroke: 2.5px var(--outline); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--outline); }
  .sheet > img { width: 84px; filter: drop-shadow(3px 3px 0 rgba(20,17,12,.3)); }
  .sheet h2 { margin: 0; font: 800 23px/1.1 'Baloo2', sans-serif; }
  .sheet p { margin: 0; font-weight: 700; font-size: 13.5px; color: #6E5B40; line-height: 1.4; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .chip { display: inline-flex; align-items: center; gap: 4px; border: 2.5px solid var(--outline); border-radius: 999px; padding: 1px 10px; font: 800 12.5px 'Nunito', sans-serif; background: var(--chip); }
  .chip.gold { background: var(--gold); }
  .pt { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: var(--ice); border: 2px solid var(--outline); color: var(--ice-ink); font: 800 10px/1 'Nunito', sans-serif; font-style: normal; flex: none; }
  .pt.lg { width: 30px; height: 30px; font-size: 16px; border-width: 2.5px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .stat { border: 2.5px solid var(--outline); border-radius: 14px; padding: 6px 4px; background: var(--chip); }
  .stat b { display: block; font: 800 22px/1 'Baloo2', sans-serif; }
  .stat span { font: 800 10px 'Nunito', sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #6E5B40; }
  .reward { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; border: 2.5px dashed var(--outline); border-radius: 14px; padding: 8px; background: var(--ice-pale); font: 800 20px 'Baloo2', sans-serif; }
  .reward small { display: block; font: 700 11.5px 'Nunito', sans-serif; color: #6E5B40; }
  .btn { width: 100%; border: 3px solid var(--outline); border-radius: 14px; padding: 10px 12px; font: 700 17px 'Baloo2', sans-serif; cursor: pointer; box-shadow: 3px 3px 0 var(--outline); background: var(--gold); color: var(--outline); }
  .btn.ice { background: var(--ice); }
  .btn.ghost { background: var(--chip); }
  .btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--outline); }
  .btn:disabled { opacity: .5; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div class="overlay" id="intro" hidden>
  <div class="sheet">
    <div class="logo">Zibo Tuğla</div>
    <img src="../../images/zibo_df_pose3.webp" alt="">
    <p id="introText"></p>
    <div class="chips"><span class="chip gold" id="introPlays"></span><span class="chip" id="introBest"></span></div>
    <button class="btn" id="startBtn"></button>
    <button class="btn ice" id="playAdBtn" hidden></button>
  </div>
</div>

<div class="overlay" id="cont" hidden>
  <div class="sheet">
    <h2 id="contTitle"></h2>
    <img src="../../images/zibo_df_pose1.webp" alt="">
    <p id="contText"></p>
    <button class="btn ice" id="contBtn"></button>
    <button class="btn" id="contEnd"></button>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="sheet">
    <h2 id="resTitle"></h2>
    <img id="resImg" src="../../images/zibo_df_pose3.webp" alt="">
    <div class="stats">
      <div class="stat"><b id="resA">0</b><span id="resAL"></span></div>
      <div class="stat"><b id="resB">0</b><span id="resBL"></span></div>
    </div>
    <div class="reward"><i class="pt lg">★</i><div><span id="resPts"></span><small id="resNote"></small></div></div>
    <button class="btn" id="againBtn"></button>
    <button class="btn ghost" id="exitBtn"></button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var TEXT = {
    tr: {
      intro: 'Parmağını basılı tutup nişan al, bırakınca coinler fırlasın. Tuğlaların sayısını sıfırla, +1 halkalarıyla daha çok coin at. Tuğlalar kırmızı çizgiye inerse oyun biter!',
      playsLeft: '{n} hak kaldı', noPlays: 'Bugünlük hakların bitti', best: 'Rekor tur {n}', start: 'Başla', waiting: 'Bekleniyor…', adPlay: '🎬 Reklam izle, +1 hak',
      turn: 'Tur {n}', hint: 'Basılı tut, nişan al, bırak', fast: 'Hızlandırıldı ×2', ring: '+1 coin', cleared: 'Sıralar temizlendi, devam!',
      contTitle: 'Tuğlalar dibe indi!', contText: '{b} tuğla kırdın. En alttaki sıraları temizleyip devam edebilir ya da {p} ★ alıp bitirebilirsin.',
      contAd: '🎬 Reklam izle, sıraları sil', contPro: '↶ Sıraları sil (1 hak)', finish: 'Bitir, puanı al',
      newBest: 'Yeni rekor!', over: 'Oyun bitti!', turns: 'Tur', bricks: 'Kırılan tuğla',
      pts: '+{n} puan', note: '{b} tuğla × {m}', capNote: ' (tur tavanı {k})',
      again: 'Tekrar oyna ({n} hak)', againNo: 'Hak kalmadı', exit: 'Oyun Salonu\'na dön', adFail: 'Reklam şu an yok, sonra tekrar dene'
    },
    en: {
      intro: 'Hold your finger to aim and release to launch the coins. Bring the bricks\' numbers to zero and grab +1 rings for more coins. If the bricks reach the red line, it\'s over!',
      playsLeft: '{n} plays left', noPlays: 'No plays left today', best: 'Best turn {n}', start: 'Start', waiting: 'Please wait…', adPlay: '🎬 Watch an ad, +1 play',
      turn: 'Turn {n}', hint: 'Hold, aim, release', fast: 'Speed ×2', ring: '+1 coin', cleared: 'Rows cleared, keep going!',
      contTitle: 'The bricks reached the bottom!', contText: 'You broke {b} bricks. Clear the bottom rows and continue, or finish and take {p} ★.',
      contAd: '🎬 Watch an ad, clear rows', contPro: '↶ Clear rows (1 left)', finish: 'Finish, take points',
      newBest: 'New record!', over: 'Game over!', turns: 'Turns', bricks: 'Bricks broken',
      pts: '+{n} points', note: '{b} bricks × {m}', capNote: ' (round cap {k})',
      again: 'Play again ({n} left)', againNo: 'No plays left', exit: 'Back to Game Hall', adFail: 'No ad right now, try again later'
    },
    es: {
      intro: 'Mantén el dedo para apuntar y suéltalo para lanzar las monedas. Lleva a cero los números de los ladrillos y toma anillos +1 para más monedas. ¡Si llegan a la línea roja, se acabó!',
      playsLeft: 'Te quedan {n} partidas', noPlays: 'No te quedan partidas hoy', best: 'Récord ronda {n}', start: 'Empezar', waiting: 'Espera…', adPlay: '🎬 Mira un anuncio, +1 partida',
      turn: 'Ronda {n}', hint: 'Mantén, apunta, suelta', fast: 'Velocidad ×2', ring: '+1 moneda', cleared: '¡Filas despejadas, sigue!',
      contTitle: '¡Los ladrillos llegaron abajo!', contText: 'Rompiste {b} ladrillos. Despeja las filas de abajo y sigue, o termina y llévate {p} ★.',
      contAd: '🎬 Mira un anuncio, despeja filas', contPro: '↶ Despejar filas (1 vez)', finish: 'Terminar, cobrar puntos',
      newBest: '¡Nuevo récord!', over: '¡Fin del juego!', turns: 'Rondas', bricks: 'Ladrillos rotos',
      pts: '+{n} puntos', note: '{b} ladrillos × {m}', capNote: ' (tope {k})',
      again: 'Jugar de nuevo (quedan {n})', againNo: 'No quedan partidas', exit: 'Volver a la Sala de Juegos', adFail: 'No hay anuncio ahora, inténtalo luego'
    }
  };
  var lang = 'tr';
  function t(key, vars) {
    var s = (TEXT[lang] && TEXT[lang][key]) || TEXT.tr[key] || key;
    if (vars) Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(vars[k]); });
    return s;
  }

  // ---------- köprü ----------
  var CFG = { locale: 'tr', tier: 'free', playsLeft: 3, best: 0, perBrick: 1, cap: 400 };
  var hasHost = !!(window.ZiboBridge && window.ZiboBridge.postMessage);
  function send(msg) {
    msg.game = 'tugla';
    if (hasHost) { window.ZiboBridge.postMessage(JSON.stringify(msg)); return; }
    setTimeout(function () {
      if (msg.type === 'start') window.ziboStartResult({ ok: CFG.playsLeft > 0, playsLeft: Math.max(0, CFG.playsLeft - 1) });
      if (msg.type === 'finish') window.ziboFinishResult({ accepted: true, points: Math.min(CFG.cap, msg.points) });
      if (msg.type === 'requestAd') window.ziboAdResult({ ok: true, reason: msg.reason, playsLeft: CFG.playsLeft + (msg.reason === 'extraPlay' ? 1 : 0) });
      if (msg.type === 'exit') location.reload();
    }, msg.type === 'requestAd' ? 900 : 60);
  }
  function $(id) { return document.getElementById(id); }
  window.ziboInit = function (cfg) {
    Object.keys(cfg || {}).forEach(function (k) { CFG[k] = cfg[k]; });
    lang = TEXT[CFG.locale] ? CFG.locale : 'tr';
    document.documentElement.lang = lang;
    showIntro();
  };
  window.ziboStartResult = function (r) {
    CFG.playsLeft = r.playsLeft;
    if (r.ok) { $('intro').hidden = true; $('result').hidden = true; startGame(); } else showIntro();
  };
  window.ziboFinishResult = function (r) { showResult(r.accepted ? r.points : 0); };
  window.ziboAdResult = function (r) {
    if (typeof r.playsLeft === 'number') CFG.playsLeft = r.playsLeft;
    if (r.reason === 'continue') {
      if (r.ok) { bricks = bricks.filter(function (b) { return b.r < ROWS - 4; }); conts += 1; state = 'aim'; $('cont').hidden = true; toast(t('cleared')); }
      else { toast(t('adFail')); $('cont').hidden = false; }
      return;
    }
    if (!r.ok) toast(t('adFail'));
    showIntro();
  };

  // ---------- tuval ----------
  var W = 360, H = 640, OUT = '#14110C';
  var canvas = $('c'), ctx = canvas.getContext('2d');
  function fit() {
    var s = Math.min(window.innerWidth / W, window.innerHeight / H), dpr = window.devicePixelRatio || 1;
    canvas.style.width = (W * s) + 'px'; canvas.style.height = (H * s) + 'px';
    canvas.width = Math.round(W * s * dpr); canvas.height = Math.round(H * s * dpr);
    ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  }
  fit(); window.addEventListener('resize', fit);
  function img(src) { var i = new Image(); i.src = src; return i; }
  function ready(i) { return i.complete && i.naturalWidth; }
  var coinImg = img('../../images/zibo_coin.webp'), ziboUp = img('../../images/zibo_df_pose4.webp');
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  function outlined(txt, x, y, size, fill) {
    ctx.font = '800 ' + size + 'px Baloo2, Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = size / 6; ctx.strokeStyle = OUT; ctx.fillStyle = OUT; ctx.fillText(txt, x + 2.5, y + 2.5); ctx.strokeText(txt, x, y); ctx.fillStyle = fill; ctx.fillText(txt, x, y);
  }
  function pill(x, y, w, h) { ctx.fillStyle = OUT; rr(x + 3, y + 3, w, h, h / 2); ctx.fill(); ctx.fillStyle = '#FFFDF7'; ctx.strokeStyle = OUT; ctx.lineWidth = 3; rr(x, y, w, h, h / 2); ctx.fill(); ctx.stroke(); }
  function ptIcon(x, y, r) { ctx.fillStyle = '#8FD3FF'; ctx.strokeStyle = OUT; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#0E3A5C'; ctx.font = '800 ' + (r * 1.2) + 'px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('★', x, y + 1); }
  function drawCoin(x, y, r) { if (ready(coinImg)) ctx.drawImage(coinImg, x - r, y - r, r * 2, r * 2); else { ctx.fillStyle = '#F3B23C'; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); } }
  var toastText = '', toastT = 0;
  function toast(m) { toastText = m; toastT = 1.8; }

  // ---------- oyun ----------
  var COLS = 7, CW = W / 7, TOP = 100, ROWS = 9, FLOOR = 590, R = 7, SPEED = 900;
  var state = 'idle', tt = 0, bricks, rings, balls, count, pending, launchX, nextX, aim, turnNo, broken, fireLeft, fireT, turnT, conts, pops, aiming = false;
  function reset() {
    bricks = []; rings = []; balls = []; count = 1; pending = 0; launchX = W / 2; nextX = null; aim = -Math.PI / 2;
    turnNo = 1; broken = 0; fireLeft = 0; fireT = 0; turnT = 0; conts = 0; pops = [];
    spawnRow(); shift(); spawnRow();
  }
  function spawnRow() {
    var cols = [0, 1, 2, 3, 4, 5, 6].sort(function () { return Math.random() - 0.5; });
    var n = 3 + Math.floor(Math.random() * Math.min(4, 1 + turnNo / 4));
    for (var i = 0; i < n; i++) bricks.push({ c: cols[i], r: 0, hp: Math.random() < 0.22 ? turnNo * 2 : turnNo });
    rings.push({ c: cols[n], r: 0 });
  }
  function shift() { bricks.forEach(function (b) { b.r += 1; }); rings.forEach(function (g) { g.r += 1; }); rings = rings.filter(function (g) { return g.r < ROWS; }); }
  function rect(b) { return { x: b.c * CW + 3, y: TOP + b.r * CW + 3, w: CW - 6, h: CW - 6 }; }
  function points() { return Math.min(CFG.cap, broken * CFG.perBrick); }
  function clampAim(a) { return Math.max(-Math.PI + 0.12, Math.min(-0.12, a)); }
  function startGame() { reset(); state = 'aim'; }
  function fire() { if (state !== 'aim') return; state = 'fly'; fireLeft = count; fireT = 0; turnT = 0; nextX = null; }
  function endTurn() {
    launchX = nextX === null ? launchX : nextX;
    count += pending; pending = 0; turnNo += 1;
    shift(); spawnRow();
    if (bricks.some(function (b) { return b.r >= ROWS - 1; })) { over(); return; }
    state = 'aim';
  }
  function over() {
    state = 'over';
    if (conts < 1) {
      $('contTitle').textContent = t('contTitle');
      $('contText').textContent = t('contText', { b: broken, p: points() });
      $('contBtn').textContent = CFG.tier === 'free' ? t('contAd') : t('contPro');
      $('contEnd').textContent = t('finish');
      $('cont').hidden = false;
    } else finish();
  }
  function finish() {
    if (state === 'end') return;
    state = 'end'; $('cont').hidden = true;
    send({ type: 'finish', points: points(), score: turnNo, stats: { turn: turnNo, bricks: broken } });
  }
  function showResult(pts) {
    var nb = turnNo > (CFG.best || 0);
    if (nb) CFG.best = turnNo;
    $('resTitle').textContent = nb ? t('newBest') : t('over');
    $('resImg').src = '../../images/' + (nb ? 'zibo_df_pose3' : 'zibo_df_pose1') + '.webp';
    $('resA').textContent = turnNo; $('resAL').textContent = t('turns');
    $('resB').textContent = broken; $('resBL').textContent = t('bricks');
    $('resPts').textContent = t('pts', { n: pts });
    $('resNote').textContent = t('note', { b: broken, m: CFG.perBrick }) + (pts >= CFG.cap ? t('capNote', { k: CFG.cap }) : '');
    var left = CFG.playsLeft;
    $('againBtn').textContent = left > 0 ? t('again', { n: left }) : t('againNo'); $('againBtn').disabled = left <= 0;
    $('exitBtn').textContent = t('exit');
    $('result').hidden = false;
  }
  function showIntro() {
    state = 'idle'; reset();
    $('introText').textContent = t('intro');
    var left = CFG.playsLeft;
    $('introPlays').textContent = left > 0 ? t('playsLeft', { n: left }) : t('noPlays');
    $('introBest').innerHTML = '<i class="pt">★</i>' + t('best', { n: CFG.best || 0 });
    $('startBtn').textContent = t('start'); $('startBtn').disabled = false; $('startBtn').hidden = left <= 0;
    $('playAdBtn').textContent = t('adPlay'); $('playAdBtn').disabled = false; $('playAdBtn').hidden = !(left <= 0 && CFG.canAdForPlay);
    $('result').hidden = true; $('cont').hidden = true; $('intro').hidden = false;
  }
  $('startBtn').addEventListener('click', function () { this.disabled = true; this.textContent = t('waiting'); send({ type: 'start' }); });
  $('playAdBtn').addEventListener('click', function () { this.disabled = true; send({ type: 'requestAd', reason: 'extraPlay' }); });
  $('contBtn').addEventListener('click', function () { $('cont').hidden = true; send({ type: 'requestAd', reason: 'continue' }); });
  $('contEnd').addEventListener('click', finish);
  $('againBtn').addEventListener('click', function () { this.disabled = true; send({ type: 'start' }); });
  $('exitBtn').addEventListener('click', function () { send({ type: 'exit' }); });

  function pt(e) { var r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  function setAim(p) { var dy = p.y - FLOOR, dx = p.x - launchX; if (dy > -8) dy = -8; aim = clampAim(Math.atan2(dy, dx)); }
  canvas.addEventListener('pointerdown', function (e) { if (state !== 'aim') return; e.preventDefault(); aiming = true; canvas.setPointerCapture(e.pointerId); setAim(pt(e)); });
  canvas.addEventListener('pointermove', function (e) { if (aiming) setAim(pt(e)); });
  canvas.addEventListener('pointerup', function () { if (!aiming) return; aiming = false; fire(); });
  canvas.addEventListener('pointercancel', function () { aiming = false; });
  window.addEventListener('keydown', function (e) {
    if (state !== 'aim') return;
    if (e.code === 'ArrowLeft') { e.preventDefault(); aim = clampAim(aim - 0.05); }
    if (e.code === 'ArrowRight') { e.preventDefault(); aim = clampAim(aim + 0.05); }
    if (e.code === 'Space') { e.preventDefault(); fire(); }
  });

  function step(ball, dt) {
    var px = ball.x, py = ball.y;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    if (ball.x < R) { ball.x = R; ball.vx = Math.abs(ball.vx); }
    if (ball.x > W - R) { ball.x = W - R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y < TOP - 4 + R) { ball.y = TOP - 4 + R; ball.vy = Math.abs(ball.vy); }
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i], q = rect(b);
      var nx = Math.max(q.x, Math.min(ball.x, q.x + q.w)), ny = Math.max(q.y, Math.min(ball.y, q.y + q.h));
      var dx = ball.x - nx, dy = ball.y - ny;
      if (dx * dx + dy * dy < R * R) {
        var outX = px < q.x || px > q.x + q.w, outY = py < q.y || py > q.y + q.h;
        if (outX && !outY) ball.vx = -ball.vx; else if (outY && !outX) ball.vy = -ball.vy; else { ball.vx = -ball.vx; ball.vy = -ball.vy; }
        ball.x = px; ball.y = py;
        b.hp -= 1;
        if (b.hp <= 0) { bricks.splice(i, 1); broken += 1; pops.push({ x: q.x + q.w / 2, y: q.y + q.h / 2, t: 0, txt: '+' + CFG.perBrick + ' ★' }); }
        break;
      }
    }
    for (var j = 0; j < rings.length; j++) {
      var g = rings[j], gx = g.c * CW + CW / 2, gy = TOP + g.r * CW + CW / 2;
      if ((ball.x - gx) * (ball.x - gx) + (ball.y - gy) * (ball.y - gy) < 18 * 18) { rings.splice(j, 1); pending += 1; pops.push({ x: gx, y: gy, t: 0, txt: t('ring') }); break; }
    }
    if (ball.vy > 0 && ball.y >= FLOOR - R) { ball.y = FLOOR - R; ball.done = true; if (nextX === null) nextX = Math.max(20, Math.min(W - 20, ball.x)); }
  }
  function update(dt) {
    tt += dt; toastT = Math.max(0, toastT - dt);
    pops = pops.filter(function (p) { p.t += dt; return p.t < 0.8; });
    if (state !== 'fly') return;
    turnT += dt;
    var sp = turnT > 4 ? 2 : 1;
    fireT -= dt;
    while (fireLeft > 0 && fireT <= 0) { balls.push({ x: launchX, y: FLOOR - R, vx: Math.cos(aim) * SPEED, vy: Math.sin(aim) * SPEED }); fireLeft -= 1; fireT += 0.07; }
    var steps = Math.ceil(dt * sp / 0.004), h = dt * sp / steps;
    for (var s = 0; s < steps; s++) balls.forEach(function (ball) { if (!ball.done) step(ball, h); });
    balls = balls.filter(function (ball) { return !ball.done; });
    if (fireLeft === 0 && balls.length === 0) endTurn();
  }
  function color(hp) {
    var k = Math.min(1, hp / Math.max(8, turnNo * 1.4)), ramp = ['#FFF3DC', '#FAD99C', '#F3B23C', '#EE9A45', '#E4553B'];
    return ramp[Math.min(ramp.length - 1, Math.floor(k * ramp.length))];
  }
  function draw() {
    var g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#FFF1D2'); g.addColorStop(1, '#FFE3A6');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(20,17,12,.07)';
    for (var y = TOP; y < FLOOR; y += 14) for (var x = 7; x < W; x += 14) { ctx.beginPath(); ctx.arc(x, y, 1.2, 0, 6.283); ctx.fill(); }
    var dangerY = TOP + (ROWS - 1) * CW;
    ctx.save(); ctx.setLineDash([8, 6]); ctx.strokeStyle = 'rgba(228,85,59,.55)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, dangerY); ctx.lineTo(W, dangerY); ctx.stroke(); ctx.restore();
    ctx.fillStyle = '#C9A46B'; ctx.fillRect(0, FLOOR, W, H - FLOOR);
    ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, FLOOR); ctx.lineTo(W, FLOOR); ctx.stroke();
    rings.forEach(function (r) {
      var gx = r.c * CW + CW / 2, gy = TOP + r.r * CW + CW / 2, pr = 12 + Math.sin(tt * 5) * 1.5;
      ctx.fillStyle = '#DDF2FF'; ctx.strokeStyle = OUT; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(gx, gy, pr, 0, 6.283); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#0E3A5C'; ctx.font = '800 12px Baloo2, Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('+1', gx, gy + 1);
    });
    bricks.forEach(function (b) {
      var q = rect(b);
      ctx.fillStyle = OUT; rr(q.x + 3, q.y + 3, q.w, q.h, 9); ctx.fill();
      ctx.fillStyle = color(b.hp); ctx.strokeStyle = OUT; ctx.lineWidth = 2.5; rr(q.x, q.y, q.w, q.h, 9); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.35)'; rr(q.x + 5, q.y + 4, q.w - 10, 5, 3); ctx.fill();
      ctx.fillStyle = OUT; ctx.font = '800 ' + (b.hp > 99 ? 15 : 18) + 'px Baloo2, Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(b.hp), q.x + q.w / 2, q.y + q.h / 2 + 2);
    });
    if (state === 'aim') {
      ctx.fillStyle = 'rgba(20,17,12,.55)';
      for (var d = 24; d < 300; d += 16) { ctx.beginPath(); ctx.arc(launchX + Math.cos(aim) * d, FLOOR - R + Math.sin(aim) * d, 3, 0, 6.283); ctx.fill(); }
      drawCoin(launchX, FLOOR - R, R + 1);
    }
    balls.forEach(function (ball) { drawCoin(ball.x, ball.y, R + 1); });
    if (nextX !== null && state === 'fly') drawCoin(nextX, FLOOR - R, R + 1);
    if (ready(ziboUp)) ctx.drawImage(ziboUp, launchX - 20, FLOOR - 2, 40, 50);
    outlined('× ' + (state === 'fly' ? fireLeft : count), Math.min(W - 30, Math.max(30, launchX + 40)), FLOOR + 22, 16, '#FFFDF7');
    if (state !== 'idle') {
      pill(14, 16, 104, 34); ptIcon(33, 33, 11);
      ctx.font = '800 19px Baloo2, Nunito, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = OUT; ctx.fillText(String(points()), 48, 34);
      outlined(t('turn', { n: turnNo }), W / 2, 34, 22, '#FFFDF7');
      pill(W - 104, 16, 90, 34); drawCoin(W - 86, 33, 12);
      ctx.font = '800 19px Baloo2, Nunito, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = OUT; ctx.fillText(String(count + pending), W - 68, 34);
      ctx.font = '800 11px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#6E5B40';
      ctx.fillText(state === 'fly' && turnT > 4 ? t('fast') : t('hint'), W / 2, 72);
    }
    pops.forEach(function (p) { ctx.globalAlpha = 1 - p.t / 0.8; outlined(p.txt, p.x, p.y - 8 - p.t * 40, 15, '#8FD3FF'); ctx.globalAlpha = 1; });
    if (toastT > 0) {
      ctx.globalAlpha = Math.min(1, toastT * 3); ctx.font = '800 13px Nunito, sans-serif';
      var tw = ctx.measureText(toastText).width + 28; ctx.fillStyle = OUT; rr(W / 2 - tw / 2, H - 38, tw, 28, 14); ctx.fill();
      ctx.fillStyle = '#FFF8E8'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(toastText, W / 2, H - 24); ctx.globalAlpha = 1;
    }
  }
  reset();
  var lastT = performance.now();
  function loop(now) { var dt = Math.min(0.033, (now - lastT) / 1000); lastT = now; update(dt); draw(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  if (hasHost) send({ type: 'ready' }); else window.ziboInit({ locale: (navigator.language || 'tr').slice(0, 2), canAdForPlay: true });
})();
