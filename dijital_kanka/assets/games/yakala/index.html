<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Coin Yakala</title>
<!--
  Coin Yakala — Oyun Salonu oyunu (WebView, bkz. docs/game_zibo.md).
  Uygulamada Flutter `GameWebViewScreen` açar, `ZiboBridge` ile konuşur; tarayıcıda DEMO modu.
  Puan rakamları Flutter'dan `ziboInit` config'iyle gelir (varsayılan: 1 skor = 1 ★, tavan 400).
-->
<style>
  @font-face { font-family: 'Baloo2'; src: url('../../fonts/Baloo2-Variable.ttf') format('truetype'); font-weight: 400 800; }
  @font-face { font-family: 'Nunito'; src: url('../../fonts/Nunito-Variable.ttf') format('truetype'); font-weight: 200 1000; }
  :root { --outline: #14110C; --gold: #F3B23C; --cream: #FFF8E8; --chip: #FFFDF7; --ice: #8FD3FF; --ice-pale: #DDF2FF; --ice-ink: #0E3A5C; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #FFE9B8; color: #2A2115; font-family: 'Nunito', system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
  .overlay { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(255, 244, 222, .84); overflow-y: auto; }
  .overlay[hidden], .btn[hidden] { display: none; }
  .sheet { width: 100%; max-width: 320px; margin: auto; background: var(--cream); border: 3px solid var(--outline); border-radius: 22px; box-shadow: 5px 5px 0 var(--outline); padding: 16px; display: grid; gap: 10px; justify-items: center; text-align: center; }
  .logo { font: 800 32px/1 'Baloo2', sans-serif; color: var(--gold); -webkit-text-stroke: 2.5px var(--outline); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--outline); }
  .sheet > img { width: 84px; filter: drop-shadow(3px 3px 0 rgba(20,17,12,.3)); }
  .sheet h2 { margin: 0; font: 800 23px/1.1 'Baloo2', sans-serif; }
  .sheet p { margin: 0; font-weight: 700; font-size: 13.5px; color: #6E5B40; line-height: 1.4; }
  .legend { width: 100%; display: grid; gap: 5px; text-align: left; }
  .legend div { display: flex; align-items: center; gap: 8px; border: 2.5px solid var(--outline); border-radius: 12px; background: var(--chip); padding: 3px 8px; font: 700 12px 'Nunito', sans-serif; }
  .legend canvas { width: 26px; height: 26px; flex: none; }
  .legend b { font: 800 13.5px 'Baloo2', sans-serif; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .chip { display: inline-flex; align-items: center; gap: 4px; border: 2.5px solid var(--outline); border-radius: 999px; padding: 1px 10px; font: 800 12.5px 'Nunito', sans-serif; background: var(--chip); }
  .chip.gold { background: var(--gold); }
  .pt { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: var(--ice); border: 2px solid var(--outline); color: var(--ice-ink); font: 800 10px/1 'Nunito', sans-serif; font-style: normal; flex: none; }
  .pt.lg { width: 30px; height: 30px; font-size: 16px; border-width: 2.5px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .stat { border: 2.5px solid var(--outline); border-radius: 14px; padding: 6px 4px; background: var(--chip); }
  .stat b { display: block; font: 800 22px/1 'Baloo2', sans-serif; }
  .stat span { font: 800 10px 'Nunito', sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #6E5B40; }
  .reward { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; border: 2.5px dashed var(--outline); border-radius: 14px; padding: 8px; background: var(--ice-pale); font: 800 20px 'Baloo2', sans-serif; }
  .reward small { display: block; font: 700 11.5px 'Nunito', sans-serif; color: #6E5B40; }
  .btn { width: 100%; border: 3px solid var(--outline); border-radius: 14px; padding: 10px 12px; font: 700 17px 'Baloo2', sans-serif; cursor: pointer; box-shadow: 3px 3px 0 var(--outline); background: var(--gold); color: var(--outline); }
  .btn.ice { background: var(--ice); }
  .btn.ghost { background: var(--chip); }
  .btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--outline); }
  .btn:disabled { opacity: .5; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div class="overlay" id="intro" hidden>
  <div class="sheet">
    <div class="logo">Coin Yakala</div>
    <p id="introText"></p>
    <div class="legend" id="legend"></div>
    <div class="chips"><span class="chip gold" id="introPlays"></span><span class="chip" id="introBest"></span></div>
    <button class="btn" id="startBtn"></button>
    <button class="btn ice" id="playAdBtn" hidden></button>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="sheet">
    <h2 id="resTitle"></h2>
    <img id="resImg" src="../../images/zibo_df_pose3.webp" alt="">
    <div class="stats">
      <div class="stat"><b id="resA">0</b><span id="resAL"></span></div>
      <div class="stat"><b id="resB">0</b><span id="resBL"></span></div>
    </div>
    <div class="reward"><i class="pt lg">★</i><div><span id="resPts"></span><small id="resNote"></small></div></div>
    <button class="btn" id="againBtn"></button>
    <button class="btn ghost" id="exitBtn"></button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var TEXT = {
    tr: {
      intro: 'Zibo\'yu parmağınla sağa sola kaydır, düşen coinleri yakala, bombalardan kaç. 45 saniye hayatta kal!',
      coin: 'Coin', coinD: '1 skor', stack: 'Coin kesesi', stackD: '3 skor, çok hızlı düşer', magnet: 'Mıknatıs', magnetD: '3 sn coinleri çeker', bomb: 'Bomba', bombD: '1 can gider (3 can)',
      playsLeft: '{n} hak kaldı', noPlays: 'Bugünlük hakların bitti', best: 'Rekor {n}', start: 'Başla', waiting: 'Bekleniyor…', adPlay: '🎬 Reklam izle, +1 hak',
      sec: '{n} sn', magnetHud: 'Mıknatıs {n}', hint: 'Kaydır: Zibo\'yu hareket ettir',
      newBest: 'Yeni rekor!', timeUp: 'Süre bitti!', dead: 'Canların bitti!', score: 'Skor', livesLeft: 'Kalan can', lasted: 'Dayandın',
      pts: '+{n} puan', note: '{s} skor = {s} puan', capNote: ' (tur tavanı {c})', deadNote: 'Canın bittiği için bu turda puan yok',
      again: 'Tekrar oyna ({n} hak)', againNo: 'Hak kalmadı', exit: 'Oyun Salonu\'na dön', adFail: 'Reklam şu an yok, sonra tekrar dene', magnetPop: 'Mıknatıs!'
    },
    en: {
      intro: 'Slide Zibo left and right with your finger, catch the falling coins and dodge the bombs. Survive 45 seconds!',
      coin: 'Coin', coinD: '1 point', stack: 'Coin bag', stackD: '3 points, falls very fast', magnet: 'Magnet', magnetD: 'pulls coins for 3 s', bomb: 'Bomb', bombD: 'costs 1 life (3 lives)',
      playsLeft: '{n} plays left', noPlays: 'No plays left today', best: 'Best {n}', start: 'Start', waiting: 'Please wait…', adPlay: '🎬 Watch an ad, +1 play',
      sec: '{n} s', magnetHud: 'Magnet {n}', hint: 'Slide: move Zibo',
      newBest: 'New record!', timeUp: 'Time\'s up!', dead: 'Out of lives!', score: 'Score', livesLeft: 'Lives left', lasted: 'Lasted',
      pts: '+{n} points', note: '{s} score = {s} points', capNote: ' (round cap {c})', deadNote: 'Out of lives, no points this round',
      again: 'Play again ({n} left)', againNo: 'No plays left', exit: 'Back to Game Hall', adFail: 'No ad right now, try again later', magnetPop: 'Magnet!'
    },
    es: {
      intro: 'Desliza a Zibo con el dedo, atrapa las monedas que caen y esquiva las bombas. ¡Aguanta 45 segundos!',
      coin: 'Moneda', coinD: '1 punto', stack: 'Bolsa de monedas', stackD: '3 puntos, cae muy rápido', magnet: 'Imán', magnetD: 'atrae monedas 3 s', bomb: 'Bomba', bombD: 'quita 1 vida (3 vidas)',
      playsLeft: 'Te quedan {n} partidas', noPlays: 'No te quedan partidas hoy', best: 'Récord {n}', start: 'Empezar', waiting: 'Espera…', adPlay: '🎬 Mira un anuncio, +1 partida',
      sec: '{n} s', magnetHud: 'Imán {n}', hint: 'Desliza: mueve a Zibo',
      newBest: '¡Nuevo récord!', timeUp: '¡Se acabó el tiempo!', dead: '¡Sin vidas!', score: 'Puntos', livesLeft: 'Vidas', lasted: 'Aguantaste',
      pts: '+{n} puntos', note: '{s} puntos de juego = {s} puntos', capNote: ' (tope {c})', deadNote: 'Te quedaste sin vidas, sin puntos esta vez',
      again: 'Jugar de nuevo (quedan {n})', againNo: 'No quedan partidas', exit: 'Volver a la Sala de Juegos', adFail: 'No hay anuncio ahora, inténtalo luego', magnetPop: '¡Imán!'
    }
  };
  var lang = 'tr';
  function t(key, vars) {
    var s = (TEXT[lang] && TEXT[lang][key]) || TEXT.tr[key] || key;
    if (vars) Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(vars[k]); });
    return s;
  }

  // ---------- köprü ----------
  var CFG = { locale: 'tr', tier: 'free', playsLeft: 3, best: 0, perScore: 1, cap: 400 };
  var hasHost = !!(window.ZiboBridge && window.ZiboBridge.postMessage);
  function send(msg) {
    msg.game = 'yakala';
    if (hasHost) { window.ZiboBridge.postMessage(JSON.stringify(msg)); return; }
    setTimeout(function () {
      if (msg.type === 'start') window.ziboStartResult({ ok: CFG.playsLeft > 0, playsLeft: Math.max(0, CFG.playsLeft - 1) });
      if (msg.type === 'finish') window.ziboFinishResult({ accepted: true, points: Math.min(CFG.cap, msg.points) });
      if (msg.type === 'requestAd') window.ziboAdResult({ ok: true, reason: msg.reason, playsLeft: CFG.playsLeft + 1 });
      if (msg.type === 'exit') location.reload();
    }, msg.type === 'requestAd' ? 900 : 60);
  }
  function $(id) { return document.getElementById(id); }
  window.ziboInit = function (cfg) {
    Object.keys(cfg || {}).forEach(function (k) { CFG[k] = cfg[k]; });
    lang = TEXT[CFG.locale] ? CFG.locale : 'tr';
    document.documentElement.lang = lang;
    showIntro();
  };
  window.ziboStartResult = function (r) {
    if (typeof r.canAdForPlay === 'boolean') CFG.canAdForPlay = r.canAdForPlay;
    CFG.playsLeft = r.playsLeft;
    if (r.ok) { $('intro').hidden = true; $('result').hidden = true; startGame(); } else showIntro();
  };
  window.ziboFinishResult = function (r) {
    if (typeof r.canAdForPlay === 'boolean') CFG.canAdForPlay = r.canAdForPlay;
    if (typeof r.playsLeft === 'number') CFG.playsLeft = r.playsLeft; showResult(r.accepted ? r.points : 0); };
  window.ziboAdResult = function (r) {
    if (typeof r.canAdForPlay === 'boolean') CFG.canAdForPlay = r.canAdForPlay;
    if (typeof r.playsLeft === 'number') CFG.playsLeft = r.playsLeft;
    if (!r.ok) toastMsg(t('adFail'));
    showIntro();
  };

  // ---------- tuval ----------
  var W = 360, H = 640, OUT = '#14110C', GROUND = 70, ROUND = 45;
  var canvas = $('c'), ctx = canvas.getContext('2d');
  function fit() {
    var s = Math.min(window.innerWidth / W, window.innerHeight / H), dpr = window.devicePixelRatio || 1;
    canvas.style.width = (W * s) + 'px'; canvas.style.height = (H * s) + 'px';
    canvas.width = Math.round(W * s * dpr); canvas.height = Math.round(H * s * dpr);
    ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  }
  fit(); window.addEventListener('resize', fit);
  function img(src) { var i = new Image(); i.src = src; return i; }
  function ready(i) { return i.complete && i.naturalWidth; }
  var coinImg = img('../../images/zibo_coin.webp'), ziboUp = img('../../images/zibo_df_pose4.webp'), ziboHurt = img('../../images/zibo_df_pose1.webp');
  function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
  function outlined(txt, x, y, size, fill) {
    ctx.font = '800 ' + size + 'px Baloo2, Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = size / 6; ctx.strokeStyle = OUT; ctx.fillStyle = OUT; ctx.fillText(txt, x + 2.5, y + 2.5); ctx.strokeText(txt, x, y); ctx.fillStyle = fill; ctx.fillText(txt, x, y);
  }
  function pill(x, y, w, h) { ctx.fillStyle = OUT; rr(ctx, x + 3, y + 3, w, h, h / 2); ctx.fill(); ctx.fillStyle = '#FFFDF7'; ctx.strokeStyle = OUT; ctx.lineWidth = 3; rr(ctx, x, y, w, h, h / 2); ctx.fill(); ctx.stroke(); }
  function ptIcon(x, y, r) { ctx.fillStyle = '#8FD3FF'; ctx.strokeStyle = OUT; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#0E3A5C'; ctx.font = '800 ' + (r * 1.2) + 'px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('★', x, y + 1); }
  function drawCoin(c, x, y, r, sq) { c.save(); c.translate(x, y); c.scale(sq || 1, 1); if (ready(coinImg)) c.drawImage(coinImg, -r, -r, r * 2, r * 2); else { c.fillStyle = '#F3B23C'; c.beginPath(); c.arc(0, 0, r, 0, 6.283); c.fill(); } c.restore(); }
  function drawStack(c, x, y, r) {
    c.save(); c.translate(x, y);
    c.fillStyle = OUT; c.beginPath(); c.ellipse(3, 5, r, r * 0.95, 0, 0, 6.283); c.fill();
    c.fillStyle = '#DC8F1E'; c.strokeStyle = OUT; c.lineWidth = 2.5; c.beginPath(); c.ellipse(0, 2, r, r * 0.95, 0, 0, 6.283); c.fill(); c.stroke();
    c.fillStyle = '#F3B23C'; c.beginPath(); c.moveTo(-r * 0.45, -r * 0.7); c.lineTo(r * 0.45, -r * 0.7); c.lineTo(r * 0.25, -r * 1.05); c.lineTo(-r * 0.25, -r * 1.05); c.closePath(); c.fill(); c.stroke();
    drawCoin(c, 0, 4, r * 0.6); c.restore();
  }
  function drawBomb(c, x, y, r, tt) {
    c.save(); c.translate(x, y);
    c.fillStyle = OUT; c.beginPath(); c.arc(3, 3, r, 0, 6.283); c.fill();
    c.fillStyle = '#3A342C'; c.strokeStyle = OUT; c.lineWidth = 2.5; c.beginPath(); c.arc(0, 0, r, 0, 6.283); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.arc(-r * 0.35, -r * 0.35, r * 0.25, 0, 6.283); c.fill();
    c.fillStyle = '#6E5B40'; rr(c, -r * 0.3, -r - 5, r * 0.6, 7, 2); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(0, -r - 5); c.quadraticCurveTo(r * 0.5, -r - 14, r * 0.3, -r - 18); c.stroke();
    var fl = 4 + Math.sin((tt || 0) * 30) * 1.5;
    c.fillStyle = '#F3B23C'; c.beginPath(); c.arc(r * 0.3, -r - 19, fl, 0, 6.283); c.fill();
    c.fillStyle = '#FF6A3D'; c.beginPath(); c.arc(r * 0.3, -r - 19, fl * 0.5, 0, 6.283); c.fill();
    c.restore();
  }
  function drawMagnet(c, x, y, r) {
    c.save(); c.translate(x, y); c.lineCap = 'butt';
    c.strokeStyle = OUT; c.lineWidth = r * 0.75 + 5; c.beginPath(); c.arc(0, 0, r * 0.7, Math.PI, 0, true); c.stroke();
    c.strokeStyle = '#E4553B'; c.lineWidth = r * 0.75; c.beginPath(); c.arc(0, 0, r * 0.7, Math.PI, 0, true); c.stroke();
    c.fillStyle = '#FFFDF7'; c.strokeStyle = OUT; c.lineWidth = 2.5;
    rr(c, -r * 1.075, -r * 0.05, r * 0.75, r * 0.45, 2); c.fill(); c.stroke();
    rr(c, r * 0.325, -r * 0.05, r * 0.75, r * 0.45, 2); c.fill(); c.stroke();
    c.restore();
  }
  function heart(x, y, s, fill) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s / 20, s / 20);
    ctx.beginPath(); ctx.moveTo(0, 6); ctx.bezierCurveTo(-14, -4, -8, -16, 0, -8); ctx.bezierCurveTo(8, -16, 14, -4, 0, 6); ctx.closePath();
    ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2.4; ctx.stroke(); ctx.restore();
  }
  var clouds = [];
  for (var ci = 0; ci < 4; ci++) clouds.push({ x: Math.random() * W, y: 70 + Math.random() * 220, s: 0.6 + Math.random() * 0.6 });
  var toastText = '', toastT = 0;
  function toastMsg(m) { toastText = m; toastT = 1.8; }

  // ---------- oyun ----------
  var state = 'idle', tt = 0, zibo, items, pops, score, lives, timeLeft, spawnT, magnetT, hurtT, shakeT, squashT, targetX, keys = {}, outcome = null;
  function reset() {
    zibo = { x: W / 2, y: H - GROUND - 44 }; targetX = W / 2; items = []; pops = [];
    score = 0; lives = 3; timeLeft = ROUND; spawnT = 0.4; magnetT = 0; hurtT = 0; shakeT = 0; squashT = 0; outcome = null;
  }
  reset();
  function progress() { return 1 - timeLeft / ROUND; }
  function points() { return Math.min(CFG.cap, Math.round(score * CFG.perScore)); }
  function spawn() {
    var p = progress(), r = Math.random(), bc = 0.2 + p * 0.2;
    var kind = r < bc ? 'bomb' : r < bc + 0.04 ? 'stack' : (r < bc + 0.055 && magnetT <= 0) ? 'magnet' : 'coin';
    var base = 210 + p * 240;
    items.push({ kind: kind, x: 26 + Math.random() * (W - 52), y: -30, vy: kind === 'stack' ? base * 1.35 : kind === 'bomb' ? base * 1.08 : base, vx: kind === 'coin' && p > 0.15 ? (Math.random() - 0.5) * (60 + p * 80) : 0, spin: Math.random() * 6 });
  }
  function startGame() { reset(); state = 'play'; }
  function finish(survived) {
    if (state !== 'play') return;
    state = 'end';
    outcome = { survived: survived, time: Math.ceil(ROUND - timeLeft) };
    setTimeout(function () { send({ type: 'finish', points: survived ? points() : 0, score: survived ? score : 0, stats: { score: score, lives: lives, survived: survived } }); }, 700);
  }
  function showResult(pts) {
    var surv = outcome && outcome.survived, nb = surv && score > (CFG.best || 0);
    if (nb) CFG.best = score;
    $('resTitle').textContent = surv ? (nb ? t('newBest') : t('timeUp')) : t('dead');
    $('resImg').src = '../../images/' + (surv ? 'zibo_df_pose3' : 'zibo_df_pose1') + '.webp';
    $('resA').textContent = score; $('resAL').textContent = t('score');
    if (surv) { $('resB').textContent = lives; $('resBL').textContent = t('livesLeft'); }
    else { $('resB').textContent = t('sec', { n: outcome.time }); $('resBL').textContent = t('lasted'); }
    $('resPts').textContent = t('pts', { n: pts });
    $('resNote').textContent = surv ? t('note', { s: score }) + (pts >= CFG.cap ? t('capNote', { c: CFG.cap }) : '') : t('deadNote');
    var left = CFG.playsLeft;
    $('againBtn').textContent = left > 0 ? t('again', { n: left }) : t('againNo'); $('againBtn').disabled = left <= 0;
    $('exitBtn').textContent = t('exit');
    $('result').hidden = false;
  }
  function showIntro() {
    state = 'idle';
    $('introText').textContent = t('intro');
    var lg = $('legend'); lg.innerHTML = '';
    [['coin'], ['stack'], ['magnet'], ['bomb']].forEach(function (r) {
      var k = r[0], d = document.createElement('div');
      d.innerHTML = '<canvas width="52" height="52"></canvas><span><b>' + t(k) + '</b> ' + t(k + 'D') + '</span>';
      lg.appendChild(d);
      var c = d.querySelector('canvas').getContext('2d'); c.setTransform(2, 0, 0, 2, 0, 0);
      if (k === 'coin') drawCoin(c, 13, 13, 10); if (k === 'stack') drawStack(c, 13, 15, 9); if (k === 'bomb') drawBomb(c, 12, 16, 7, 0); if (k === 'magnet') drawMagnet(c, 13, 13, 9);
    });
    var left = CFG.playsLeft;
    $('introPlays').textContent = left > 0 ? t('playsLeft', { n: left }) : t('noPlays');
    $('introBest').innerHTML = '<i class="pt">★</i>' + t('best', { n: CFG.best || 0 });
    $('startBtn').textContent = t('start'); $('startBtn').disabled = false; $('startBtn').hidden = left <= 0;
    $('playAdBtn').textContent = t('adPlay'); $('playAdBtn').disabled = false; $('playAdBtn').hidden = !(left <= 0 && CFG.canAdForPlay);
    $('result').hidden = true; $('intro').hidden = false;
  }
  coinImg.addEventListener('load', function () { if (!$('intro').hidden) showIntro(); });
  $('startBtn').addEventListener('click', function () { this.disabled = true; this.textContent = t('waiting'); send({ type: 'start' }); });
  $('playAdBtn').addEventListener('click', function () { this.disabled = true; send({ type: 'requestAd', reason: 'extraPlay' }); });
  $('againBtn').addEventListener('click', function () { this.disabled = true; send({ type: 'start' }); });
  $('exitBtn').addEventListener('click', function () { send({ type: 'exit' }); });

  function px(e) { var r = canvas.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
  var drag = false;
  canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); drag = true; canvas.setPointerCapture(e.pointerId); targetX = px(e); });
  canvas.addEventListener('pointermove', function (e) { if (drag || e.pointerType === 'mouse') targetX = px(e); });
  canvas.addEventListener('pointerup', function () { drag = false; });
  window.addEventListener('keydown', function (e) { if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { e.preventDefault(); keys[e.code] = true; } });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });

  function update(dt) {
    tt += dt; toastT = Math.max(0, toastT - dt);
    clouds.forEach(function (c) { c.x -= 10 * c.s * dt; if (c.x < -80) { c.x = W + 60; c.y = 70 + Math.random() * 220; } });
    pops = pops.filter(function (p) { p.t += dt; return p.t < 0.8; });
    hurtT = Math.max(0, hurtT - dt); shakeT = Math.max(0, shakeT - dt); squashT = Math.max(0, squashT - dt);
    if (state === 'idle') { zibo.x = W / 2 + Math.sin(tt * 1.6) * 60; return; }

    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(20,17,12,.07)';

      ctx.beginPath(); ctx.arc(0, 0, 20, Math.PI * 0.5, Math.PI * 1.5); ctx.arc(22, -12, 22, Math.PI, Math.PI * 1.85); ctx.arc(48, -4, 18, Math.PI * 1.3, Math.PI * 0.5); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    });
    items.forEach(function (it) {

      else if (it.kind === 'stack') drawStack(ctx, it.x, it.y, 17);
      else if (it.kind === 'bomb') drawBomb(ctx, it.x, it.y, 15, tt);

    });

    ctx.fillStyle = '#C9A46B'; ctx.fillRect(0, gy, W, GROUND);
    for (var gx = 0; gx < W; gx += 24) { ctx.fillStyle = '#F3B23C'; ctx.fillRect(gx, gy, 12, 16); ctx.fillStyle = '#F6D488'; ctx.fillRect(gx + 12, gy, 12, 16); }
    ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.moveTo(0, gy + 16); ctx.lineTo(W, gy + 16); ctx.stroke();
    if (magnetT > 0) { ctx.save(); ctx.globalAlpha = 0.25 + Math.sin(tt * 10) * 0.1; ctx.strokeStyle = '#E4553B'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(zibo.x, zibo.y - 20, 56 + Math.sin(tt * 8) * 4, 0, 6.283); ctx.stroke(); ctx.restore(); }
    ctx.fillStyle = 'rgba(20,17,12,.2)'; ctx.beginPath(); ctx.ellipse(zibo.x, H - GROUND + 2, 30, 6, 0, 0, 6.283); ctx.fill();

})();
