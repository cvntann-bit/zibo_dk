<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zibo Tren</title>
<!--
  Zibo Tren — Oyun Salonu oyunu (Snake tarzı; WebView, bkz. docs/game_zibo.md).
  Uygulamada Flutter `GameWebViewScreen` açar, `ZiboBridge` ile konuşur; tarayıcıda DEMO modu.
  Puan rakamları Flutter'dan `ziboInit` config'iyle gelir (varsayılan: coin × 5, tavan 600).
-->
<style>
  @font-face { font-family: 'Baloo2'; src: url('../../fonts/Baloo2-Variable.ttf') format('truetype'); font-weight: 400 800; }
  @font-face { font-family: 'Nunito'; src: url('../../fonts/Nunito-Variable.ttf') format('truetype'); font-weight: 200 1000; }
  :root { --outline: #14110C; --gold: #F3B23C; --cream: #FFF8E8; --chip: #FFFDF7; --ice: #8FD3FF; --ice-pale: #DDF2FF; --ice-ink: #0E3A5C; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #FFE9B8; color: #2A2115; font-family: 'Nunito', system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
  .overlay { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(255, 244, 222, .84); overflow-y: auto; }
  .overlay[hidden], .btn[hidden] { display: none; }
  .sheet { width: 100%; max-width: 320px; margin: auto; background: var(--cream); border: 3px solid var(--outline); border-radius: 22px; box-shadow: 5px 5px 0 var(--outline); padding: 16px; display: grid; gap: 10px; justify-items: center; text-align: center; }
  .logo { font: 800 32px/1 'Baloo2', sans-serif; color: var(--gold); -webkit-text-stroke: 2.5px var(--outline); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--outline); }
  .sheet > img { width: 84px; filter: drop-shadow(3px 3px 0 rgba(20,17,12,.3)); }
  .sheet h2 { margin: 0; font: 800 23px/1.1 'Baloo2', sans-serif; }
  .sheet p { margin: 0; font-weight: 700; font-size: 13.5px; color: #6E5B40; line-height: 1.4; }
  .legend { width: 100%; display: grid; gap: 5px; text-align: left; }
  .legend div { display: flex; align-items: center; gap: 8px; border: 2.5px solid var(--outline); border-radius: 12px; background: var(--chip); padding: 3px 8px; font: 700 12px 'Nunito', sans-serif; }
  .legend canvas { width: 26px; height: 26px; flex: none; }
  .legend b { font: 800 13.5px 'Baloo2', sans-serif; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .chip { display: inline-flex; align-items: center; gap: 4px; border: 2.5px solid var(--outline); border-radius: 999px; padding: 1px 10px; font: 800 12.5px 'Nunito', sans-serif; background: var(--chip); }
  .chip.gold { background: var(--gold); }
  .pt { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: var(--ice); border: 2px solid var(--outline); color: var(--ice-ink); font: 800 10px/1 'Nunito', sans-serif; font-style: normal; flex: none; }
  .pt.lg { width: 30px; height: 30px; font-size: 16px; border-width: 2.5px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .stat { border: 2.5px solid var(--outline); border-radius: 14px; padding: 6px 4px; background: var(--chip); }
  .stat b { display: block; font: 800 22px/1 'Baloo2', sans-serif; }
  .stat span { font: 800 10px 'Nunito', sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #6E5B40; }
  .reward { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; border: 2.5px dashed var(--outline); border-radius: 14px; padding: 8px; background: var(--ice-pale); font: 800 20px 'Baloo2', sans-serif; }
  .reward small { display: block; font: 700 11.5px 'Nunito', sans-serif; color: #6E5B40; }
  .btn { width: 100%; border: 3px solid var(--outline); border-radius: 14px; padding: 10px 12px; font: 700 17px 'Baloo2', sans-serif; cursor: pointer; box-shadow: 3px 3px 0 var(--outline); background: var(--gold); color: var(--outline); }
  .btn.ice { background: var(--ice); }
  .btn.ghost { background: var(--chip); }
  .btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--outline); }
  .btn:disabled { opacity: .5; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div class="overlay" id="intro" hidden>
  <div class="sheet">
    <div class="logo">Zibo Tren</div>
    <p id="introText"></p>
    <div class="legend" id="legend"></div>
    <div class="chips"><span class="chip gold" id="introPlays"></span><span class="chip" id="introBest"></span></div>
    <button class="btn" id="startBtn"></button>
    <button class="btn ice" id="playAdBtn" hidden></button>
  </div>
</div>

<div class="overlay" id="cont" hidden>
  <div class="sheet">
    <h2 id="contTitle"></h2>
    <img src="../../images/zibo_df_pose1.webp" alt="">
    <p id="contText"></p>
    <button class="btn ice" id="contBtn"></button>
    <button class="btn" id="contEnd"></button>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="sheet">
    <h2 id="resTitle"></h2>
    <img id="resImg" src="../../images/zibo_df_pose3.webp" alt="">
    <div class="stats">
      <div class="stat"><b id="resA">0</b><span id="resAL"></span></div>
      <div class="stat"><b id="resB">0</b><span id="resBL"></span></div>
    </div>
    <div class="reward"><i class="pt lg">★</i><div><span id="resPts"></span><small id="resNote"></small></div></div>
    <button class="btn" id="againBtn"></button>
    <button class="btn ghost" id="exitBtn"></button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var TEXT = {
    tr: {
      intro: 'Kaydırarak Zibo\'ya yön ver. Topladığın her coin arkasına vagon olur. Duvara, kayaya ya da kendi trenine çarpma!',
      coin: 'Coin', coinD: 'trene 1 vagon', stack: 'Coin kesesi', stackD: '3 vagon birden', ice: 'Buz küpü', iceD: 'treni 4 sn yavaşlatır', rock: 'Kaya', rockD: 'her 6 coinde bir belirir',
      playsLeft: '{n} hak kaldı', noPlays: 'Bugünlük hakların bitti', best: 'Rekor {n} coin', start: 'Başla', waiting: 'Bekleniyor…', adPlay: '🎬 Reklam izle, +1 hak',
      len: 'Boy {n}', slow: '❄ Yavaş {n}', hint: 'Kaydır: yön ver', paused: 'Kaydır, devam et', slowPop: 'Yavaş!', back: 'Kaydırınca tren yeniden kalkar',
      contTitle: 'Çarptın!', contText: '{c} coin topladın. Birkaç adım geri dönüp devam edebilir ya da {p} ★ alıp bitirebilirsin.',
      contAd: '🎬 Reklam izle, geri dön', contPro: '↶ Geri dön (1 hak)', finish: 'Bitir, puanı al',
      newBest: 'Yeni rekor!', stopped: 'Tren durdu!', coins: 'Coin', length: 'Tren boyu',
      pts: '+{n} puan', note: '{c} coin × {m}', capNote: ' (tur tavanı {k})',
      again: 'Tekrar oyna ({n} hak)', againNo: 'Hak kalmadı', exit: 'Oyun Salonu\'na dön', adFail: 'Reklam şu an yok, sonra tekrar dene'
    },
    en: {
      intro: 'Swipe to steer Zibo. Every coin you collect becomes a wagon behind him. Don\'t hit the walls, rocks or your own train!',
      coin: 'Coin', coinD: '+1 wagon', stack: 'Coin bag', stackD: '3 wagons at once', ice: 'Ice cube', iceD: 'slows the train for 4 s', rock: 'Rock', rockD: 'appears every 6 coins',
      playsLeft: '{n} plays left', noPlays: 'No plays left today', best: 'Best {n} coins', start: 'Start', waiting: 'Please wait…', adPlay: '🎬 Watch an ad, +1 play',
      len: 'Length {n}', slow: '❄ Slow {n}', hint: 'Swipe: steer', paused: 'Swipe to continue', slowPop: 'Slow!', back: 'Swipe and the train sets off again',
      contTitle: 'Crash!', contText: 'You collected {c} coins. Go back a few steps and continue, or finish and take {p} ★.',
      contAd: '🎬 Watch an ad, go back', contPro: '↶ Go back (1 left)', finish: 'Finish, take points',
      newBest: 'New record!', stopped: 'Train stopped!', coins: 'Coins', length: 'Train length',
      pts: '+{n} points', note: '{c} coins × {m}', capNote: ' (round cap {k})',
      again: 'Play again ({n} left)', againNo: 'No plays left', exit: 'Back to Game Hall', adFail: 'No ad right now, try again later'
    },
    es: {
      intro: 'Desliza para guiar a Zibo. Cada moneda que atrapas se vuelve un vagón detrás de él. ¡No choques con paredes, rocas ni tu propio tren!',
      coin: 'Moneda', coinD: '+1 vagón', stack: 'Bolsa de monedas', stackD: '3 vagones de golpe', ice: 'Cubito de hielo', iceD: 'frena el tren 4 s', rock: 'Roca', rockD: 'aparece cada 6 monedas',
      playsLeft: 'Te quedan {n} partidas', noPlays: 'No te quedan partidas hoy', best: 'Récord {n} monedas', start: 'Empezar', waiting: 'Espera…', adPlay: '🎬 Mira un anuncio, +1 partida',
      len: 'Largo {n}', slow: '❄ Lento {n}', hint: 'Desliza: dirige', paused: 'Desliza para seguir', slowPop: '¡Lento!', back: 'Desliza y el tren arranca de nuevo',
      contTitle: '¡Choque!', contText: 'Atrapaste {c} monedas. Retrocede unos pasos y sigue, o termina y llévate {p} ★.',
      contAd: '🎬 Mira un anuncio, retrocede', contPro: '↶ Retroceder (1 vez)', finish: 'Terminar, cobrar puntos',
      newBest: '¡Nuevo récord!', stopped: '¡El tren se detuvo!', coins: 'Monedas', length: 'Largo del tren',
      pts: '+{n} puntos', note: '{c} monedas × {m}', capNote: ' (tope {k})',
      again: 'Jugar de nuevo (quedan {n})', againNo: 'No quedan partidas', exit: 'Volver a la Sala de Juegos', adFail: 'No hay anuncio ahora, inténtalo luego'
    }
  };
  var lang = 'tr';
  function t(key, vars) {
    var s = (TEXT[lang] && TEXT[lang][key]) || TEXT.tr[key] || key;
    if (vars) Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(vars[k]); });
    return s;
  }

  // ---------- köprü ----------
  var CFG = { locale: 'tr', tier: 'free', playsLeft: 3, best: 0, perCoin: 5, cap: 600 };
  var hasHost = !!(window.ZiboBridge && window.ZiboBridge.postMessage);
  function send(msg) {
    msg.game = 'tren';
    if (hasHost) { window.ZiboBridge.postMessage(JSON.stringify(msg)); return; }
    setTimeout(function () {
      if (msg.type === 'start') window.ziboStartResult({ ok: CFG.playsLeft > 0, playsLeft: Math.max(0, CFG.playsLeft - 1) });
      if (msg.type === 'finish') window.ziboFinishResult({ accepted: true, points: Math.min(CFG.cap, msg.points) });
      if (msg.type === 'requestAd') window.ziboAdResult({ ok: true, reason: msg.reason, playsLeft: CFG.playsLeft + (msg.reason === 'extraPlay' ? 1 : 0) });
      if (msg.type === 'exit') location.reload();
    }, msg.type === 'requestAd' ? 900 : 60);
  }
  function $(id) { return document.getElementById(id); }
  window.ziboInit = function (cfg) {
    Object.keys(cfg || {}).forEach(function (k) { CFG[k] = cfg[k]; });
    lang = TEXT[CFG.locale] ? CFG.locale : 'tr';
    document.documentElement.lang = lang;
    showIntro();
  };
  window.ziboStartResult = function (r) {
    CFG.playsLeft = r.playsLeft;
    if (r.ok) { $('intro').hidden = true; $('result').hidden = true; startGame(); } else showIntro();
  };
  window.ziboFinishResult = function (r) { showResult(r.accepted ? r.points : 0); };
  window.ziboAdResult = function (r) {
    if (typeof r.playsLeft === 'number') CFG.playsLeft = r.playsLeft;
    if (r.reason === 'continue') { if (r.ok) rewind(); else { toast(t('adFail')); $('cont').hidden = false; } return; }
    if (!r.ok) toast(t('adFail'));
    showIntro();
  };

  // ---------- tuval ----------
  var W = 360, H = 640, OUT = '#14110C';
  var canvas = $('c'), ctx = canvas.getContext('2d');
  function fit() {
    var s = Math.min(window.innerWidth / W, window.innerHeight / H), dpr = window.devicePixelRatio || 1;
    canvas.style.width = (W * s) + 'px'; canvas.style.height = (H * s) + 'px';
    canvas.width = Math.round(W * s * dpr); canvas.height = Math.round(H * s * dpr);
    ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  }
  fit(); window.addEventListener('resize', fit);
  function img(src) { var i = new Image(); i.src = src; return i; }
  function ready(i) { return i.complete && i.naturalWidth; }
  var coinImg = img('../../images/zibo_coin.webp'), ziboUp = img('../../images/zibo_df_pose4.webp');
  function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
  function outlined(txt, x, y, size, fill) {
    ctx.font = '800 ' + size + 'px Baloo2, Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = size / 6; ctx.strokeStyle = OUT; ctx.fillStyle = OUT; ctx.fillText(txt, x + 2.5, y + 2.5); ctx.strokeText(txt, x, y); ctx.fillStyle = fill; ctx.fillText(txt, x, y);
  }
  function pill(x, y, w, h) { ctx.fillStyle = OUT; rr(ctx, x + 3, y + 3, w, h, h / 2); ctx.fill(); ctx.fillStyle = '#FFFDF7'; ctx.strokeStyle = OUT; ctx.lineWidth = 3; rr(ctx, x, y, w, h, h / 2); ctx.fill(); ctx.stroke(); }
  function ptIcon(x, y, r) { ctx.fillStyle = '#8FD3FF'; ctx.strokeStyle = OUT; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#0E3A5C'; ctx.font = '800 ' + (r * 1.2) + 'px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('★', x, y + 1); }
  function drawCoin(c, x, y, r) { if (ready(coinImg)) c.drawImage(coinImg, x - r, y - r, r * 2, r * 2); else { c.fillStyle = '#F3B23C'; c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fill(); } }
  function drawStack(c, x, y, r) {
    c.save(); c.translate(x, y);
    c.fillStyle = OUT; c.beginPath(); c.ellipse(3, 5, r, r * 0.95, 0, 0, 6.283); c.fill();
    c.fillStyle = '#DC8F1E'; c.strokeStyle = OUT; c.lineWidth = 2.5; c.beginPath(); c.ellipse(0, 2, r, r * 0.95, 0, 0, 6.283); c.fill(); c.stroke();
    c.fillStyle = '#F3B23C'; c.beginPath(); c.moveTo(-r * 0.45, -r * 0.7); c.lineTo(r * 0.45, -r * 0.7); c.lineTo(r * 0.25, -r * 1.05); c.lineTo(-r * 0.25, -r * 1.05); c.closePath(); c.fill(); c.stroke();
    drawCoin(c, 0, 4, r * 0.6); c.restore();
  }
  function drawIce(c, x, y, r) {
    c.save(); c.translate(x, y);
    c.fillStyle = OUT; rr(c, -r + 2, -r + 2, r * 2, r * 2, 5); c.fill();
    c.fillStyle = '#DDF2FF'; c.strokeStyle = OUT; c.lineWidth = 2; rr(c, -r, -r, r * 2, r * 2, 5); c.fill(); c.stroke();
    c.strokeStyle = '#0E3A5C'; c.lineWidth = 1.8; c.lineCap = 'round';
    for (var a = 0; a < 3; a++) { c.save(); c.rotate(a * Math.PI / 3); c.beginPath(); c.moveTo(0, -r * 0.62); c.lineTo(0, r * 0.62); c.stroke(); c.restore(); }
    c.restore();
  }
  function drawRock(c, x, y, s) {
    c.fillStyle = OUT; rr(c, x + 2, y + 2, s, s, 6); c.fill();
    c.fillStyle = '#8C7456'; c.strokeStyle = OUT; c.lineWidth = 2; rr(c, x, y, s, s, 6); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.28)'; c.beginPath(); c.arc(x + s * 0.32, y + s * 0.32, s * 0.14, 0, 6.283); c.fill();
  }
  var toastText = '', toastT = 0;
  function toast(m) { toastText = m; toastT = 1.8; }

  // ---------- oyun ----------
  var COLS = 15, ROWS = 24, CELL = 22, X0 = 15, TOP = 92;
  var VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }, OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
  var state = 'idle', tt = 0, snake, dir, queue, items, rocks, eaten, grow, acc, slow, hist, rewinds, pops, flash;
  function reset() {
    snake = [{ x: 7, y: 14 }, { x: 7, y: 15 }, { x: 7, y: 16 }]; dir = 'up'; queue = []; items = []; rocks = [];
    eaten = 0; grow = 0; acc = 0; slow = 0; hist = []; rewinds = 0; pops = []; flash = 0;
    place('coin');
  }
  function occ(x, y) {
    function hit(p) { return p.x === x && p.y === y; }
    return snake.some(hit) || items.some(hit) || rocks.some(hit);
  }
  function free(away) {
    var h = snake[0];
    for (var i = 0; i < 200; i++) {
      var x = Math.floor(Math.random() * COLS), y = Math.floor(Math.random() * ROWS);
      if (occ(x, y)) continue;
      if (away && Math.abs(x - h.x) + Math.abs(y - h.y) < 4) continue;
      return { x: x, y: y };
    }
    return null;
  }
  function place(kind) { var p = free(kind === 'rock'); if (!p) return; if (kind === 'rock') rocks.push(p); else items.push({ kind: kind, x: p.x, y: p.y }); }
  function points() { return Math.min(CFG.cap, eaten * CFG.perCoin); }
  function interval() { return Math.max(85, 165 - eaten * 3) + (slow > 0 ? 80 : 0); }
  function startGame() { reset(); state = 'play'; }
  function turn(d) {
    if (state === 'paused') { if (d !== OPP[dir]) { dir = d; queue = []; } state = 'play'; acc = 0; return; }
    if (state !== 'play') return;
    var last = queue.length ? queue[queue.length - 1] : dir;
    if (d === last || d === OPP[last] || queue.length >= 2) return;
    queue.push(d);
  }
  function snap() { return JSON.stringify({ s: snake, d: dir, i: items, r: rocks, e: eaten, g: grow }); }
  function tick() {
    if (queue.length) dir = queue.shift();
    var h = snake[0], v = VEC[dir], nx = h.x + v[0], ny = h.y + v[1];
    hist.push(snap()); if (hist.length > 14) hist.shift();
    var wall = nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS;
    var self = snake.some(function (p, i) { return p.x === nx && p.y === ny && !(i === snake.length - 1 && grow === 0); });
    var rock = rocks.some(function (p) { return p.x === nx && p.y === ny; });
    if (wall || self || rock) { crash(); return; }
    snake.unshift({ x: nx, y: ny });
    if (grow > 0) grow--; else snake.pop();
    var idx = -1;
    items.forEach(function (it, i) { if (it.x === nx && it.y === ny) idx = i; });
    if (idx < 0) return;
    var it = items.splice(idx, 1)[0], px = X0 + nx * CELL + CELL / 2, py = TOP + ny * CELL;
    if (it.kind === 'ice') { slow = 4; pops.push({ x: px, y: py, t: 0, txt: t('slowPop'), ice: true }); return; }
    var n = it.kind === 'stack' ? 3 : 1, before = eaten;
    eaten += n; grow += n;
    pops.push({ x: px, y: py, t: 0, txt: '+' + (n * CFG.perCoin) + ' ★' });
    if (it.kind === 'coin') place('coin');
    if (!items.some(function (x) { return x.kind === 'stack'; }) && Math.random() < 0.18) place('stack');
    if (!items.some(function (x) { return x.kind === 'ice'; }) && Math.random() < 0.12) place('ice');
    if (Math.floor(eaten / 6) > Math.floor(before / 6) && rocks.length < 14) place('rock');
    if (!items.some(function (x) { return x.kind === 'coin'; })) place('coin');
  }
  function crash() {
    state = 'crashed'; flash = 0.45;
    setTimeout(function () {
      if (state !== 'crashed') return;
      if (rewinds < 1 && hist.length >= 4) {
        $('contTitle').textContent = t('contTitle');
        $('contText').textContent = t('contText', { c: eaten, p: points() });
        $('contBtn').textContent = CFG.tier === 'free' ? t('contAd') : t('contPro');
        $('contEnd').textContent = t('finish');
        $('cont').hidden = false;
      } else finish();
    }, 550);
  }
  function rewind() {
    var s = JSON.parse(hist[Math.max(0, hist.length - 6)]);
    snake = s.s; dir = s.d; items = s.i; rocks = s.r; eaten = s.e; grow = s.g; queue = []; hist = []; rewinds += 1;
    state = 'paused'; $('cont').hidden = true; toast(t('back'));
  }
  function finish() {
    if (state === 'end') return;
    state = 'end'; $('cont').hidden = true;
    send({ type: 'finish', points: points(), score: eaten, stats: { coins: eaten, length: snake.length } });
  }
  function showResult(pts) {
    var nb = eaten > (CFG.best || 0);
    if (nb) CFG.best = eaten;
    $('resTitle').textContent = nb ? t('newBest') : t('stopped');
    $('resImg').src = '../../images/' + (nb ? 'zibo_df_pose3' : 'zibo_df_pose1') + '.webp';
    $('resA').textContent = eaten; $('resAL').textContent = t('coins');
    $('resB').textContent = snake.length; $('resBL').textContent = t('length');
    $('resPts').textContent = t('pts', { n: pts });
    $('resNote').textContent = t('note', { c: eaten, m: CFG.perCoin }) + (pts >= CFG.cap ? t('capNote', { k: CFG.cap }) : '');
    var left = CFG.playsLeft;
    $('againBtn').textContent = left > 0 ? t('again', { n: left }) : t('againNo'); $('againBtn').disabled = left <= 0;
    $('exitBtn').textContent = t('exit');
    $('result').hidden = false;
  }
  function showIntro() {
    state = 'idle'; reset();
    $('introText').textContent = t('intro');
    var lg = $('legend'); lg.innerHTML = '';
    ['coin', 'stack', 'ice', 'rock'].forEach(function (k) {
      var d = document.createElement('div');
      d.innerHTML = '<canvas width="52" height="52"></canvas><span><b>' + t(k) + '</b> ' + t(k + 'D') + '</span>';
      lg.appendChild(d);
      var c = d.querySelector('canvas').getContext('2d'); c.setTransform(2, 0, 0, 2, 0, 0);
      if (k === 'coin') drawCoin(c, 13, 13, 10); if (k === 'stack') drawStack(c, 13, 15, 9); if (k === 'ice') drawIce(c, 13, 13, 10); if (k === 'rock') drawRock(c, 3, 3, 20);
    });
    var left = CFG.playsLeft;
    $('introPlays').textContent = left > 0 ? t('playsLeft', { n: left }) : t('noPlays');
    $('introBest').innerHTML = '<i class="pt">★</i>' + t('best', { n: CFG.best || 0 });
    $('startBtn').textContent = t('start'); $('startBtn').disabled = false; $('startBtn').hidden = left <= 0;
    $('playAdBtn').textContent = t('adPlay'); $('playAdBtn').disabled = false; $('playAdBtn').hidden = !(left <= 0 && CFG.canAdForPlay);
    $('result').hidden = true; $('cont').hidden = true; $('intro').hidden = false;
  }
  coinImg.addEventListener('load', function () { if (!$('intro').hidden) showIntro(); });
  $('startBtn').addEventListener('click', function () { this.disabled = true; this.textContent = t('waiting'); send({ type: 'start' }); });
  $('playAdBtn').addEventListener('click', function () { this.disabled = true; send({ type: 'requestAd', reason: 'extraPlay' }); });
  $('contBtn').addEventListener('click', function () { $('cont').hidden = true; send({ type: 'requestAd', reason: 'continue' }); });
  $('contEnd').addEventListener('click', finish);
  $('againBtn').addEventListener('click', function () { this.disabled = true; send({ type: 'start' }); });
  $('exitBtn').addEventListener('click', function () { send({ type: 'exit' }); });
  (function () {
    var sx = 0, sy = 0, on = false;
    canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); on = true; sx = e.clientX; sy = e.clientY; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointermove', function (e) {
      if (!on) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
      turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
      sx = e.clientX; sy = e.clientY;
    });
    canvas.addEventListener('pointerup', function () { on = false; });
    canvas.addEventListener('pointercancel', function () { on = false; });
  })();
  window.addEventListener('keydown', function (e) {
    var k = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[e.code];
    if (k) { e.preventDefault(); turn(k); }
  });

  function update(dt) {
    tt += dt; toastT = Math.max(0, toastT - dt);
    pops = pops.filter(function (p) { p.t += dt; return p.t < 0.8; });
    flash = Math.max(0, flash - dt);
    if (state !== 'play') return;
    slow = Math.max(0, slow - dt);
    acc += dt * 1000;
    var iv = interval();
    while (acc >= iv && state === 'play') { acc -= iv; tick(); }
  }
  function draw() {
    var g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#FFF1D2'); g.addColorStop(1, '#FFE3A6');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    var bw = COLS * CELL, bh = ROWS * CELL;
    ctx.fillStyle = OUT; rr(ctx, X0 + 1, TOP + 1, bw + 6, bh + 6, 12); ctx.fill();
    ctx.save(); rr(ctx, X0 - 3, TOP - 3, bw + 6, bh + 6, 12); ctx.clip();
    for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) { ctx.fillStyle = (x + y) % 2 ? '#FBE9C4' : '#FFF4DE'; ctx.fillRect(X0 + x * CELL, TOP + y * CELL, CELL, CELL); }
    ctx.restore();
    ctx.strokeStyle = OUT; ctx.lineWidth = 3; rr(ctx, X0 - 3, TOP - 3, bw + 6, bh + 6, 12); ctx.stroke();
    function cx(p) { return X0 + p.x * CELL + CELL / 2; }
    function cy(p) { return TOP + p.y * CELL + CELL / 2; }
    rocks.forEach(function (p) { drawRock(ctx, X0 + p.x * CELL + 1, TOP + p.y * CELL + 1, CELL - 3); });
    items.forEach(function (it) {
      var bob = Math.sin(tt * 4 + it.x) * 1.5;
      if (it.kind === 'coin') drawCoin(ctx, cx(it), cy(it) + bob, 9.5);
      else if (it.kind === 'stack') drawStack(ctx, cx(it), cy(it) + bob, 9);
      else drawIce(ctx, cx(it), cy(it) + bob, 9);
    });
    for (var i = snake.length - 1; i >= 1; i--) drawCoin(ctx, cx(snake[i]), cy(snake[i]), 10);
    var hd = snake[0];
    ctx.fillStyle = 'rgba(20,17,12,.2)'; ctx.beginPath(); ctx.ellipse(cx(hd), cy(hd) + 10, 12, 4, 0, 0, 6.283); ctx.fill();
    if (ready(ziboUp)) { ctx.save(); ctx.translate(cx(hd), cy(hd) - 6); if (dir === 'left') ctx.scale(-1, 1); ctx.drawImage(ziboUp, -17, -22, 34, 44); ctx.restore(); }
    if (state !== 'idle') {
      pill(14, 16, 104, 34); ptIcon(33, 33, 11);
      ctx.font = '800 19px Baloo2, Nunito, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = OUT; ctx.fillText(String(points()), 48, 34);
      pill(W - 104, 16, 90, 34); drawCoin(ctx, W - 86, 33, 12);
      ctx.font = '800 19px Baloo2, Nunito, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = OUT; ctx.fillText(String(eaten), W - 68, 34);
      if (slow > 0) outlined(t('slow', { n: Math.ceil(slow) }), W / 2, 34, 17, '#DDF2FF');
      else outlined(t('len', { n: snake.length }), W / 2, 34, 17, '#FFFDF7');
      ctx.font = '800 11px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#6E5B40'; ctx.fillText(t('hint'), W / 2, 72);
    }
    if (state === 'paused') outlined(t('paused'), W / 2, TOP + bh / 2, 24, '#FFFDF7');
    pops.forEach(function (p) { ctx.globalAlpha = 1 - p.t / 0.8; outlined(p.txt, p.x, p.y - 8 - p.t * 40, 16, p.ice ? '#DDF2FF' : '#8FD3FF'); ctx.globalAlpha = 1; });
    if (toastT > 0) {
      ctx.globalAlpha = Math.min(1, toastT * 3); ctx.font = '800 13px Nunito, sans-serif';
      var tw = ctx.measureText(toastText).width + 28; ctx.fillStyle = OUT; rr(ctx, W / 2 - tw / 2, H - 40, tw, 30, 15); ctx.fill();
      ctx.fillStyle = '#FFF8E8'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(toastText, W / 2, H - 25); ctx.globalAlpha = 1;
    }
    if (flash > 0) { ctx.fillStyle = 'rgba(228,85,59,' + (flash * 0.9) + ')'; ctx.fillRect(0, 0, W, H); }
  }
  reset();
  var last = performance.now();
  function loop(now) { var dt = Math.min(0.033, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  if (hasHost) send({ type: 'ready' }); else window.ziboInit({ locale: (navigator.language || 'tr').slice(0, 2), canAdForPlay: true });
})();
</script>
