<meta charset="utf-8">
<title>Zibo Mutfak Stüdyosu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Solda çizilmiş oda, sağda mağaza rafı. Eşyalar kodla çizilir, renk ve desen anında değişir. */
:root{
  color-scheme:light;
  --paper:#FFF4DE; --card:#FFFDF7; --ink:#14110C; --soft:#5B4E3A; --line:#E7D9BE; --gold:#F3B23C; --pale:#F3E4C0; --good:#3E8E4E;
  --display:"Baloo 2","Trebuchet MS",sans-serif; --body:"Nunito","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:24px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1,h2{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,5vw,42px);font-weight:800}
h2{font-size:22px;font-weight:800}
p{margin:0}
.lead{color:var(--soft);max-width:62ch;margin-top:4px}
.layout{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{width:100%;max-width:430px;margin-inline:auto;border:4px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);background:var(--card);line-height:0}
.stage svg{display:block;width:100%;height:auto}
.panel{display:grid;gap:12px;min-width:0}
.wallet{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800}
.coin{background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:2px 12px;font-variant-numeric:tabular-nums}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:800 14px var(--body);color:var(--ink);padding:5px 12px;border:2px solid var(--ink);border-radius:99px;background:var(--card);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--gold)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.opt{font:700 13px var(--body);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 6px;cursor:pointer;display:grid;gap:3px;justify-items:center;text-align:center;min-width:0}
.opt[aria-pressed="true"]{border:3px solid var(--ink);background:var(--pale)}
.opt svg{width:72px;height:72px;display:block}
.swatch{width:58px;height:58px;border-radius:50%;border:3px solid var(--ink)}
.opt small{color:var(--soft);font-weight:800;font-variant-numeric:tabular-nums}
.opt small.own{color:var(--good)}
.tabs button:focus-visible,.opt:focus-visible,.buy:focus-visible{outline:3px solid #C2412F;outline-offset:1px}
.buy{font:800 16px var(--body);color:var(--ink);padding:10px 16px;border:3px solid var(--ink);border-radius:14px;background:var(--gold);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.buy:disabled{background:var(--pale);box-shadow:none;cursor:default}
.note{font-size:14px;color:var(--soft)}
</style>
<div class="wrap">
  <header>
    <h1>Zibo Mutfak Stüdyosu</h1>
    <p class="lead">Bu odayı görsel üreticiyle değil, kodla çizdim. Sağdan boya, duvar kağıdı, zemin ve mobilya seç, oda anında değişsin. ZC örnek veri.</p>
  </header>
  <div class="layout">
    <div class="stage" id="stage"></div>
    <div class="panel">
      <div class="wallet"><span class="coin"><span id="zc"></span> ZC</span><button class="buy" id="buy"></button></div>
      <div class="tabs" id="tabs" role="group" aria-label="Kategori"></div>
      <div class="shelf" id="shelf"></div>
      <p class="note">Beğendiğin rengi önce odada dene, sonra satın al. Bir ürünü sonradan farklı renkte satmak için yeni çizim gerekmez, tek satır yeter.</p>
    </div>
  </div>
</div>

function mix(hex, amt) {
  const n = parseInt(hex.slice(1), 16), t = amt > 0 ? 255 : 0, a = Math.abs(amt);
  const f = (v) => Math.round(v + (t - v) * a).toString(16).padStart(2, '0');
  return '#' + f((n >> 16) & 255) + f((n >> 8) & 255) + f(n & 255);
}
let defs = [], uid = 0;
function grad(a, b, horizontal) {
  const id = 'g' + ++uid;
  defs.push(`<linearGradient id="${id}" x1="0" y1="0" x2="${horizontal ? 1 : 0}" y2="${horizontal ? 0 : 1}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`);
  return `url(#${id})`;
}
function shine(x, y, w, h, r, o = .35) { return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="#fff" opacity="${o}"/>`; }
function handle(x, y, w, h) { return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(w, h) / 2}" fill="${grad('#FFFFFF', '#8E96A3')}" stroke="#6E7682" stroke-width="2"/>`; }

  boya: { n: 'Boya', k: 'swatch', items: [['krem', 'Krem', '#FFE7B0', 0], ['gok', 'Gökyüzü', '#A9DDF2', 40], ['nane', 'Nane', '#B7E8CF', 40], ['pembe', 'Pembe', '#F9C6D3', 50], ['lila', 'Lila', '#D4C7F5', 50], ['seftali', 'Şeftali', '#FFC9A3', 60], ['limon', 'Limon', '#FFF0A0', 60], ['gece', 'Gece mavisi', '#4B6C9E', 80]] },
  desen: { n: 'Duvar kağıdı', k: 'pattern', items: [['duz', 'Desensiz', 0], ['puan', 'Puantiye', 120], ['cizgi', 'Çizgili', 140], ['kare', 'Kareli', 160], ['yildiz', 'Yıldızlı', 220], ['cicek', 'Çiçekli', 260]] },
  zemin: { n: 'Zemin', k: 'floor', items: [['ahsap', 'Ballı ahşap', 'ahsap', '#D99A5B', '#BF7F43', 0], ['koyu', 'Koyu ahşap', 'ahsap', '#94603A', '#7A4B2C', 150], ['karo', 'Beyaz karo', 'karo', '#F4F6F7', '#D3DADF', 220], ['dama', 'Dama', 'dama', '#FFF3DC', '#F0857D', 320], ['mavi', 'Mavi karo', 'karo', '#BFE6EA', '#8FC7CF', 240]] },
  buzdolabi: { n: 'Buzdolabı', k: 'draw', items: [['krem', 'Retro krem', 'retroFridge', '#FFF0D2', 0], ['nane', 'Retro nane', 'retroFridge', '#9FE3C9', 350], ['mercan', 'Retro mercan', 'retroFridge', '#FF8F7E', 350], ['gok', 'Retro mavi', 'retroFridge', '#7CC8F0', 350], ['ikiz', 'İkiz kapı', 'twinFridge', '#C9D2DB', 900], ['mini', 'Mini sarı', 'miniFridge', '#FFD65C', 250]] },
  ocak: { n: 'Ocak', k: 'draw', items: [['krem', 'Krem', 'stove', '#FFF0D2', 0], ['gok', 'Mavi', 'stove', '#8ED0F2', 300], ['mercan', 'Mercan', 'stove', '#FF9B8A', 300], ['siyah', 'Grafit', 'stove', '#59616C', 450]] },
  dolap: { n: 'Dolap', k: 'draw', items: [['bal', 'Bal', 'counter', '#F6C77E', 0], ['beyaz', 'Beyaz', 'counter', '#FBF6EC', 200], ['yesil', 'Yeşil', 'counter', '#9FD6A8', 220], ['lacivert', 'Lacivert', 'counter', '#577BB0', 260]] },
  masa: { n: 'Masa', k: 'draw', items: [['ahsap', 'Ahşap', 'table', '#E2A566', 0], ['beyaz', 'Beyaz', 'table', '#FBF6EC', 180], ['pembe', 'Pembe', 'table', '#F7A8BE', 220]] },
  sandalye: { n: 'Sandalye', k: 'draw', items: [['ahsap', 'Ahşap', 'chair', '#D9975A', 0], ['kirmizi', 'Kırmızı', 'chair', '#F2705E', 150], ['mavi', 'Mavi', 'chair', '#62B4E6', 150]] },
};
const eq = { boya: 'krem', desen: 'duz', zemin: 'ahsap', buzdolabi: 'krem', ocak: 'krem', dolap: 'bal', masa: 'ahsap', sandalye: 'ahsap' };
const owned = new Set(Object.entries(eq).map(([c, i]) => c + ':' + i));
let cat = 'boya';
const pick = (c, id = eq[c]) => CAT[c].items.find((x) => x[0] === id);
const price = (c, it) => it[it.length - 1];
function unpaid() { return Object.keys(eq).filter((c) => !owned.has(c + ':' + eq[c])).map((c) => [c, price(c, pick(c))]); }

function pat(body, w, h) { const id = 'p' + ++uid; defs.push(`<pattern id="${id}" width="${w}" height="${h}" patternUnits="userSpaceOnUse">${body}</pattern>`); return `url(#${id})`; }
function shadow(cx, cy, rx) { return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="16" fill="#3A1F0A" opacity=".28" filter="url(#soft)"/>`; }
function drawItem(c, x, y, s = 1) { const it = pick(c); return `<g transform="translate(${x} ${y}) scale(${s})">${DRAW[it[2]](it[3])}</g>`; }
function room() {
  defs = ['<filter id="soft" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>'];
  const wall = pick('boya')[2], d = pick('desen')[0], z = pick('zemin');
  const wallLine = mix(wall, wall === '#4B6C9E' ? .16 : -.1);
  const wp = d === 'duz' ? null : pat(WALLS[d](wallLine), 80, 80);
  const size = z[2] === 'ahsap' ? [240, 80] : z[2] === 'karo' ? [120, 120] : [160, 160];
  const floor = pat(FLOORS[z[2]](z[3], z[4]), size[0], size[1]);
  const fridge = pick('buzdolabi'), fy = fridge[2] === 'twinFridge' ? 322 : fridge[2] === 'miniFridge' ? 472 : 362;
  const body = `
  <rect width="900" height="${FLOOR}" fill="${grad(mix(wall, .2), mix(wall, -.05))}"/>
  ${wp ? `<rect width="900" height="${FLOOR}" fill="${wp}"/>` : ''}
  <path d="M560 0h340v430z" fill="#fff" opacity=".2"/>
  <g transform="translate(330 96)">
    <rect x="-16" y="-16" width="300" height="290" rx="30" fill="${grad('#FFF8EA', '#E2D3B8')}"/>
    <rect width="268" height="258" rx="18" fill="${grad('#8FD6F5', '#DDF4FB')}"/>
    <circle cx="206" cy="66" r="36" fill="#FFD64A"/><ellipse cx="74" cy="214" rx="96" ry="38" fill="#9FDB8E"/><ellipse cx="210" cy="226" rx="86" ry="30" fill="#7CCB78"/>
    <rect x="128" y="0" width="12" height="258" fill="#F4E8D2"/><rect y="118" width="268" height="12" fill="#F4E8D2"/>
    <path d="M-30 -24h110c-8 90-22 176-74 244h-36z" fill="${grad('#FF9F8F', '#E9705F')}"/><path d="M298 -24h-110c8 90 22 176 74 244h36z" fill="${grad('#FF9F8F', '#E9705F')}"/>
    <rect x="-44" y="-34" width="356" height="20" rx="10" fill="${grad('#D49A5C', '#A56F3B')}"/>
  </g>
  <g transform="translate(674 330)">
    <rect x="0" y="86" width="196" height="20" rx="9" fill="${grad('#D49A5C', '#A56F3B')}"/>
    <rect x="16" y="26" width="52" height="60" rx="14" fill="${grad('#FFAF9D', '#E57F6B')}"/><rect x="10" y="14" width="64" height="18" rx="9" fill="#FFE7C2"/>
    <rect x="130" y="50" width="46" height="36" rx="10" fill="${grad('#FFB067', '#D9773C')}"/>
    <path d="M152 52c-30-10-34-34-30-46 18 6 28 20 30 46zm2 0c0-26 12-44 26-50 6 18-2 40-26 50z" fill="#55B868"/>
  </g>
  <rect y="${FLOOR - 30}" width="900" height="30" fill="${grad('#FFF8EA', '#E2D3B8')}"/>
  <rect y="${FLOOR}" width="900" height="400" fill="${floor}"/>
  <rect y="${FLOOR}" width="900" height="400" fill="${grad('#00000022', '#00000000')}"/>
  ${shadow(160, 842, 140)}${drawItem('buzdolabi', 40, fy)}
  ${shadow(380, 842, 110)}${drawItem('dolap', 284, 532)}
  ${shadow(590, 842, 130)}${drawItem('ocak', 490, 532)}
  ${shadow(760, 1098, 150)}${drawItem('sandalye', 700, 790)}
  ${drawItem('masa', 584, 782)}
  <ellipse cx="310" cy="1110" rx="170" ry="24" fill="#3A1F0A" opacity=".3" filter="url(#soft)"/>
  <image href="${ZIBO}" x="104" y="620" width="412" height="500"/>`;
  return `<svg viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zibo'nun mutfağı"><defs>${defs.join('')}</defs>${body}</svg>`;
}
function thumb(it) {
  defs = [];
  const vb = { retroFridge: '-20 -10 280 500', twinFridge: '-20 -10 300 540', miniFridge: '-30 -20 250 400', stove: '-20 -10 290 320', counter: '-20 -10 240 320', table: '-10 -10 300 340', chair: '-10 -10 200 330' }[it[2]];
  const b = DRAW[it[2]](it[3]);
  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>${defs.join('')}</defs>${b}</svg>`;
}
function tile(c, it) {
  defs = [];
  if (c === 'desen') { const line = mix('#FFE7B0', -.14); const p = it[0] === 'duz' ? null : pat(WALLS[it[0]](line), 80, 80); return `<svg viewBox="0 0 80 80" aria-hidden="true"><defs>${defs.join('')}</defs><rect width="80" height="80" fill="#FFE7B0"/>${p ? `<rect width="80" height="80" fill="${p}"/>` : ''}</svg>`; }
  const size = it[2] === 'ahsap' ? [240, 80] : it[2] === 'karo' ? [120, 120] : [160, 160];
  const p = pat(FLOORS[it[2]](it[3], it[4]), size[0], size[1]);
  return `<svg viewBox="0 0 160 160" aria-hidden="true"><defs>${defs.join('')}</defs><rect width="160" height="160" fill="${p}"/></svg>`;
}
function draw() {
  document.getElementById('stage').innerHTML = room();
  document.getElementById('zc').textContent = zc;
  const bill = unpaid(), sum = bill.reduce((n, x) => n + x[1], 0), buy = document.getElementById('buy');
  buy.disabled = bill.length === 0;
  buy.textContent = bill.length ? `Odadakileri al · ${sum} ZC` : 'Oda tamam';
  const tabs = document.getElementById('tabs');
  tabs.replaceChildren();
  for (const [k, v] of Object.entries(CAT)) {
    const b = document.createElement('button');
    b.textContent = v.n;
    b.setAttribute('aria-pressed', String(k === cat));
    b.onclick = () => { cat = k; draw(); };
    tabs.append(b);
  }
  const shelf = document.getElementById('shelf');
  shelf.replaceChildren();
  for (const it of CAT[cat].items) {
    const b = document.createElement('button');
    b.className = 'opt';
    b.setAttribute('aria-pressed', String(eq[cat] === it[0]));
    const art = document.createElement('div');
    if (CAT[cat].k === 'swatch') { art.className = 'swatch'; art.style.background = it[2]; }
    else if (CAT[cat].k === 'draw') art.innerHTML = thumb(it);
    else { art.innerHTML = tile(cat, it); art.style.cssText = 'border-radius:12px;overflow:hidden;border:2px solid #14110C'; }
    const has = owned.has(cat + ':' + it[0]), s = document.createElement('small');
    s.textContent = has ? 'Sende var' : `${price(cat, it)} ZC`;
    if (has) s.className = 'own';
    b.append(art, it[1], s);
    b.onclick = () => { eq[cat] = it[0]; draw(); };
    shelf.append(b);
  }
}
document.getElementById('buy').onclick = () => {
  const bill = unpaid(), sum = bill.reduce((n, x) => n + x[1], 0);
  if (sum > zc) { document.getElementById('buy').textContent = 'Yeterli ZC yok'; return; }
  zc -= sum;
  bill.forEach(([c]) => owned.add(c + ':' + eq[c]));
  draw();
};
draw();
</script>
