<meta charset="utf-8">
<title>Zibo Fikir Vitrini</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Telefon solda oynanır, sağda fikrin kısa künyesi. Zibo'nun çıkartma dili: tek tema, kalın mürekkep, altın vurgu. */
:root{
  color-scheme:light;
  --paper:#FFF4DE; --card:#FFFDF7; --ink:#14110C; --soft:#5B4E3A; --line:#E7D9BE; --gold:#F3B23C; --pale:#F3E4C0;
  --good:#3E8E4E; --bad:#C2412F; --sky:#BFE6EA; --night:#1F3B5C;
  --display:"Baloo 2","Trebuchet MS",sans-serif; --body:"Nunito","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
.door,.cell,.card,.food,.buy{box-sizing:border-box;min-width:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding-block:24px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,5vw,42px);font-weight:800}
h2{font-size:26px;font-weight:800}
p{margin:0}
.lead{color:var(--soft);max-width:60ch;margin-top:4px}
.layout{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:780px){.layout{grid-template-columns:minmax(0,1fr)}}
.phone{position:relative;width:100%;max-width:390px;margin-inline:auto;height:720px;background:var(--card);border:4px solid var(--ink);border-radius:30px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:3px solid var(--ink);background:var(--gold);font-weight:800}
.top b{font-family:var(--display);font-size:20px}
.pill{background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:1px 10px;font-variant-numeric:tabular-nums}
#screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:3px solid var(--ink);background:var(--card)}
.nav button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:0;padding:5px 0 7px;font-size:12px;font-weight:800;text-align:center}
.nav button img{width:30px;height:30px;object-fit:contain}
.nav button[aria-pressed="true"]{background:var(--pale)}
.nav button:focus-visible,.btn:focus-visible,.door:focus-visible,.food:focus-visible,.card:focus-visible,.cell:focus-visible,.buy:focus-visible,.seg button:focus-visible{outline:3px solid var(--bad);outline-offset:-3px}
.btn{font:800 15px var(--body);color:var(--ink);padding:8px 14px;border:3px solid var(--ink);border-radius:13px;background:var(--gold);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.btn.alt{background:var(--card)}
.btn:disabled{opacity:.5;cursor:default}
.room{position:relative;height:330px;border-bottom:3px solid var(--ink);overflow:hidden}
.room.kitchen{background:linear-gradient(#FBDDA6 0 70%,#D9A66C 70% 100%)}
.room.salon{background:linear-gradient(#F8C9B8 0 70%,#C98F5E 70% 100%)}
.room.bath{background:linear-gradient(#BFE6EA 0 70%,#E9F3F2 70% 100%)}
.room.bed{background:linear-gradient(#CFC6F2 0 70%,#B58A63 70% 100%)}
.room img{position:absolute;height:auto}
.zibo{transition:transform .2s}
.bubble{position:absolute;left:12px;top:12px;max-width:62%;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:6px 10px;font-weight:800;font-size:14px;z-index:9}
.meter{margin:10px 14px 0;height:16px;border:3px solid var(--ink);border-radius:99px;background:var(--card);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);transition:width .3s}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px 0;font-weight:800;font-size:14px}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 14px}
.food{all:unset;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:5px;display:grid;justify-items:center;font-size:12px;font-weight:800;text-align:center}
.food img{width:50px;height:50px;object-fit:contain}
.food span{color:var(--soft);font-weight:700}
.fly{position:absolute;width:56px;z-index:20;transition:all .45s ease-in;pointer-events:none}
.heart{position:absolute;font-size:22px;z-index:20;animation:up .9s ease-out forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.pad{padding:12px 14px;display:grid;gap:12px}
.set h3{font-size:17px}
.stickers{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:4px}
.slot{aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;background:var(--paper)}
.slot img{width:88%;height:88%;object-fit:contain}
.slot.empty img{filter:brightness(0);opacity:.13}
.pop{position:absolute;inset:0;background:#14110Ccc;display:grid;place-items:center;z-index:30;padding:20px}
.pop div{background:var(--card);border:4px solid var(--ink);border-radius:20px;padding:18px;display:grid;gap:8px;justify-items:center;text-align:center;animation:pop .3s ease-out;max-width:280px}
.pop img{width:120px;height:120px;object-fit:contain}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
.xmas{background:var(--night);color:#fff;min-height:100%;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-content:start}
.xmas h3{font-size:20px}
.xmas p{font-size:14px}
.scene{display:flex;justify-content:center;align-items:flex-end;gap:2px;height:96px}
.scene img{height:auto;width:62px}
.scene img.big{width:80px}
.doors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.door{all:unset;cursor:pointer;aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--ink);border-radius:10px;background:var(--gold);color:var(--ink);font:800 18px var(--display)}
.door.locked{background:#3C587A;color:#fff;cursor:default}
.door.open{background:var(--card)}
.door.today{outline:3px solid #fff}
.door img{width:82%;height:82%;object-fit:contain}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:13px;overflow:hidden;background:var(--card);justify-self:start}
.seg button{all:unset;cursor:pointer;padding:5px 12px;font-weight:800;font-size:14px}
.seg button+button{border-left:3px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--gold)}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.card{all:unset;cursor:pointer;height:92px;border:3px solid var(--ink);border-radius:12px;background:var(--gold);display:grid;place-items:center;font:800 26px var(--display)}
.card.up{background:var(--card)}
.card.done{background:#DDEFD9}
.card img{width:66px;height:66px;object-fit:contain}
.merge{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cell{all:unset;cursor:pointer;aspect-ratio:1;border:2px solid var(--line);border-radius:12px;background:var(--paper);display:grid;place-items:center}
.cell.sel{border:3px solid var(--bad);background:var(--pale)}
.cell img{width:86%;height:86%;object-fit:contain}
.chain{display:flex;gap:2px;align-items:center;font-size:12px;color:var(--soft);font-weight:800}
.chain img{width:30px;height:30px;object-fit:contain}
.seg-wrap{padding:8px 14px 0;display:flex;justify-content:center}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 14px}
.buy{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:5px;display:grid;justify-items:center;text-align:center;font-size:12px;font-weight:800}
.buy img{width:52px;height:52px;object-fit:contain}
.buy span{color:var(--soft)}
.buy.owned{border-color:var(--good);background:#EAF5E6}
.toast{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:6px 12px;border-radius:12px;z-index:40;max-width:88%;text-align:center}
.info{display:grid;gap:12px;align-content:start}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:800;padding:2px 10px;border:2px solid var(--ink);border-radius:99px;background:var(--pale)}
.info dl{margin:0;display:grid;gap:10px}
.info dt{font-weight:800}
.info dd{margin:0;color:var(--soft)}
.note{font-size:14px;color:var(--soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="wrap">
  <header>
    <h1>Zibo Fikir Vitrini</h1>
    <p class="lead">Beş fikir, tek telefonda. Alttaki sekmelerle gez, dokun ve oyna. ZC ve ilerleme örnek veri, uygulamaya bağlı değil.</p>
  </header>
  <div class="layout">
    <div class="phone">
      <div class="top"><b id="ttl"></b><span class="pill"><span id="zc"></span> ZC · <span id="star"></span> ★</span></div>
      <div id="screen"></div>
      <div class="nav" id="nav"></div>
      <div id="toast"></div>
    </div>
    <aside class="info" id="info"></aside>
  </div>
</div>

let zc = 240, star = 30, tab = 'ikram';
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function pic(id, alt, style) { const i = new Image(); i.src = IMG[id]; i.alt = alt || ''; if (style) i.style.cssText = style; return i; }
function bar() { $('zc').textContent = zc; $('star').textContent = star; }
let toastTimer;
function toast(text) {
  $('toast').replaceChildren(el('div', 'toast', text));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').replaceChildren(), 1800);
}
function popup(id, title, sub) {
  const p = el('div', 'pop'), d = el('div');
  d.append(pic(id, title), Object.assign(el('h2'), { textContent: title }), el('p', '', sub));
  const b = el('button', 'btn', 'Harika');
  b.onclick = () => p.remove();
  d.append(b); p.append(d); $('screen').append(p);
}

/* İKRAM */
const FOODS = [
  { id: 'fluent_red_apple', n: 'Elma', v: 15 }, { id: 'fluent_banana', n: 'Muz', v: 15 }, { id: 'fluent_cookie', n: 'Kurabiye', v: 15 },
  { id: 'fluent_pancakes', n: 'Krep', v: 30, p: 10 }, { id: 'fluent_ice_cream', n: 'Dondurma', v: 30, p: 12 }, { id: 'fluent_birthday_cake', n: 'Pasta', v: 45, p: 20 },
];
const ik = { free: 3, ad: true, full: 35, msg: 'Karnım zil çalıyor, bana ne ikram edeceksin?' };
function drawIkram(s) {
  const room = el('div', 'room kitchen');
  room.append(pic('quat_house_kitchen_fridge', 'Buzdolabı', 'left:10px;bottom:90px;width:96px'), pic('quat_house_kitchen_oven', 'Fırın', 'right:8px;bottom:90px;width:92px'));
  const z = pic('zibo_idle', 'Zibo', 'left:50%;bottom:8px;width:176px;margin-left:-88px;z-index:5');
  z.classList.add('zibo'); z.id = 'zibo';
  const b = el('div', 'bubble', ik.msg); b.id = 'bub';
  room.append(z, b);
  const meter = el('div', 'meter'), fill = el('i'); fill.id = 'fill'; fill.style.width = ik.full + '%'; meter.append(fill);
  const row = el('div', 'row');
  const left = el('span', '', `Ücretsiz ikram: ${ik.free}`); left.id = 'free';
  const ad = el('button', 'btn alt', 'Reklam izle, +1 ikram'); ad.style.fontSize = '13px'; ad.style.padding = '4px 9px'; ad.disabled = !ik.ad;
  ad.onclick = () => { ik.ad = false; ad.disabled = true; ad.textContent = 'Reklam izleniyor'; setTimeout(() => { ik.free += 1; toast('+1 ücretsiz ikram'); draw(); }, 900); };
  row.append(left, ad);
  const tray = el('div', 'tray');
  for (const f of FOODS) {
    const c = el('button', 'food');
    c.append(pic(f.id, f.n), f.n, el('span', '', f.p ? `${f.p} ZC` : 'Ücretsiz'));
    c.onclick = () => feed(f, c);
    tray.append(c);
  }
  s.append(room, meter, row, tray);
}
function feed(f, node) {
  if (f.p ? zc < f.p : ik.free < 1) return toast(f.p ? 'Yeterli ZC yok' : 'Bugünkü ücretsiz ikramlar bitti, yarın yine gel');
  if (ik.full >= 100) return toast('Zibo doydu, yarın yine ikram et');
  if (f.p) zc -= f.p; else ik.free -= 1;
  ik.full = Math.min(100, ik.full + f.v);
  bar();
  const scr = $('screen'), z = $('zibo');
  const a = node.getBoundingClientRect(), o = scr.getBoundingClientRect(), t = z.getBoundingClientRect();
  const fly = pic(f.id, '');
  fly.className = 'fly';
  fly.style.left = a.left - o.left + 'px'; fly.style.top = a.top - o.top + scr.scrollTop + 'px';
  scr.append(fly);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fly.style.left = t.left - o.left + t.width / 2 - 28 + 'px'; fly.style.top = t.top - o.top + scr.scrollTop + 60 + 'px'; fly.style.transform = 'scale(.5)';
  }));
  setTimeout(() => {
    fly.remove();
    z.src = IMG.zibo_happy; z.style.transform = 'scale(1.06)';
    $('fill').style.width = ik.full + '%';
    $('free').textContent = `Ücretsiz ikram: ${ik.free}`;
    ik.msg = ik.full >= 100 ? 'Doydum! Teşekkürler kanka.' : `Mmm, ${f.n.toLowerCase()} çok güzelmiş!`;
    $('bub').textContent = ik.msg;
    for (let i = 0; i < 3; i++) {
      const h = el('span', 'heart', '❤');
      h.style.left = 150 + i * 34 + 'px'; h.style.top = 120 + (i % 2) * 24 + 'px'; h.style.color = '#C2412F';
      $('screen').append(h); setTimeout(() => h.remove(), 900);
    }
    setTimeout(() => { if ($('zibo')) { $('zibo').src = IMG.zibo_idle; $('zibo').style.transform = ''; } }, 1100);
  }, 460);
}

const THEMES = {
  Yemek: ['fluent_red_apple', 'fluent_birthday_cake', 'fluent_pancakes', 'fluent_cookie', 'fluent_strawberry', 'fluent_doughnut'],
  Oyuncak: ['fluent_teddy_bear', 'fluent_kite', 'fluent_yo_yo', 'fluent_game_die', 'fluent_soccer_ball', 'fluent_nesting_dolls'],
  Bahçe: ['fluent_sunflower', 'fluent_cactus', 'fluent_tulip', 'fluent_seedling', 'fluent_blossom', 'fluent_deciduous_tree'],
};
const CHAIN = ['fluent_cherries', 'fluent_red_apple', 'fluent_cookie', 'fluent_cupcake', 'fluent_pancakes', 'fluent_birthday_cake'];
const game = { mode: 'mem', theme: 'Yemek', deck: null, flip: [], busy: false, cells: Array(16).fill(-1), sel: -1 };
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newDeck() { game.deck = shuffle([...THEMES[game.theme], ...THEMES[game.theme]]).map((id) => ({ id, up: false, done: false })); game.flip = []; }
function seg(list, cur, on) {
  const w = el('div', 'seg');
  for (const [k, t] of list) { const b = el('button', '', t); b.setAttribute('aria-pressed', String(k === cur)); b.onclick = () => on(k); w.append(b); }
  return w;
}
function drawOyun(s) {
  const p = el('div', 'pad');
  p.append(seg([['mem', 'Hafıza temaları'], ['mer', 'Birleştirme']], game.mode, (k) => { game.mode = k; draw(); }));
  if (game.mode === 'mem') {
    if (!game.deck) newDeck();
    p.append(seg(Object.keys(THEMES).map((k) => [k, k]), game.theme, (k) => { game.theme = k; newDeck(); draw(); }));
    const g = el('div', 'mem');
    game.deck.forEach((c, i) => {
      const b = el('button', 'card' + (c.up || c.done ? ' up' : '') + (c.done ? ' done' : ''));
      if (c.up || c.done) b.append(pic(c.id, 'Kart')); else b.textContent = 'Z';
      b.onclick = () => flip(i);
      g.append(b);
    });
    p.append(g);
  } else {
    const c = el('div', 'chain');
    CHAIN.forEach((id, i) => { c.append(pic(id, '')); if (i < CHAIN.length - 1) c.append('›'); });
    p.append(el('p', 'note', 'Aynı iki eşyaya dokun, bir üst eşyaya dönüşsün.'), c);
    const g = el('div', 'merge');
    game.cells.forEach((v, i) => {
      const b = el('button', 'cell' + (game.sel === i ? ' sel' : ''));
      b.setAttribute('aria-label', v < 0 ? 'Boş kare' : 'Eşya');
      if (v >= 0) b.append(pic(CHAIN[v], ''));
      b.onclick = () => tapCell(i);
      g.append(b);
    });
    const add = el('button', 'btn', 'Yeni eşya');
    add.onclick = () => {
      const empty = game.cells.map((v, i) => (v < 0 ? i : -1)).filter((i) => i >= 0);
      if (!empty.length) return toast('Tahta dolu, önce birleştir');
      game.cells[empty[Math.floor(Math.random() * empty.length)]] = Math.random() < 0.8 ? 0 : 1;
      draw();
    };
    p.append(g, add);
  }
  s.append(p);
}
function flip(i) {
  const c = game.deck[i];
  if (game.busy || c.up || c.done) return;
  c.up = true; game.flip.push(c); draw();
  if (game.flip.length < 2) return;
  const [a, b] = game.flip; game.flip = []; game.busy = true;
  setTimeout(() => {
    if (a.id === b.id) { a.done = b.done = true; star += 3; bar(); } else { a.up = b.up = false; }
    game.busy = false; draw();
    if (game.deck.every((x) => x.done)) { star += 10; bar(); toast('Bitti! +10 ★'); }
  }, 650);
}
function tapCell(i) {
  const v = game.cells[i];
  if (game.sel < 0) { if (v >= 0) { game.sel = i; draw(); } return; }
  if (game.sel === i) { game.sel = -1; return draw(); }
  const from = game.cells[game.sel];
  if (v === from && v < CHAIN.length - 1) {
    game.cells[i] = v + 1; game.cells[game.sel] = -1; game.sel = -1;
    star += (v + 1) * 2; bar();
    if (v + 1 === CHAIN.length - 1) toast('Pastayı yaptın! Zibo çok sevindi');
  } else { game.sel = v >= 0 ? i : -1; }
  draw();
}
