<meta charset="utf-8">
<title>Zibo Ev Stüdyosu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Solda kodla çizilmiş oda, sağda mağaza ya da bakım paneli. Zibo'nun çıkartma dili, tek tema. */
:root{
  color-scheme:light;
  --paper:#FFF4DE; --card:#FFFDF7; --ink:#14110C; --soft:#5B4E3A; --line:#E7D9BE; --gold:#F3B23C; --pale:#F3E4C0; --good:#3E8E4E; --sky:#62B4E6;
  --display:"Baloo 2","Trebuchet MS",sans-serif; --body:"Nunito","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:24px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,5vw,42px);font-weight:800}
h3{font-size:18px;font-weight:800}
p{margin:0}
.lead{color:var(--soft);max-width:62ch;margin-top:4px}
.layout{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;width:100%;max-width:430px;margin-inline:auto;border:4px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);background:var(--card);line-height:0;touch-action:none}
.stage svg{display:block;width:100%;height:auto}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#fx.on{pointer-events:auto;cursor:none}
.panel{display:grid;gap:12px;min-width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800}
.coin{background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:2px 12px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--card)}
.seg button{all:unset;cursor:pointer;padding:6px 14px;font-weight:800;font-size:15px}
.seg button+button{border-left:3px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--gold)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:800 14px var(--body);color:var(--ink);padding:5px 12px;border:2px solid var(--ink);border-radius:99px;background:var(--card);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--gold)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.opt{font:700 13px var(--body);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 6px;cursor:pointer;display:grid;gap:3px;justify-items:center;text-align:center;min-width:0}
.opt[aria-pressed="true"]{border:3px solid var(--ink);background:var(--pale)}
.opt svg{width:72px;height:72px;display:block}
.swatch{width:58px;height:58px;border-radius:50%;border:3px solid var(--ink)}
.tile{width:64px;height:64px;border-radius:12px;overflow:hidden;border:2px solid var(--ink)}
.opt small{color:var(--soft);font-weight:800;font-variant-numeric:tabular-nums}
.opt small.own{color:var(--good)}
.btn{font:800 16px var(--body);color:var(--ink);padding:10px 16px;border:3px solid var(--ink);border-radius:14px;background:var(--gold);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn.alt{background:var(--card)}
.btn:disabled{background:var(--pale);box-shadow:none;cursor:default;opacity:.7}
.seg button:focus-visible,.tabs button:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid #C2412F;outline-offset:1px}
.care{display:grid;gap:12px;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:14px}
.meter{height:20px;border:3px solid var(--ink);border-radius:99px;background:var(--paper);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#8ED0F2,#62B4E6);transition:width .25s}
.steps{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:8px;align-items:center;font-weight:700}
.steps li b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-family:var(--display)}
.steps li.done b{background:var(--good);color:#fff}
.steps li.now b{background:var(--gold)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:14px;color:var(--soft)}
</style>
<div class="wrap">
  <header>
    <h1>Zibo Ev Stüdyosu</h1>
    <p class="lead">Odalar kodla çizildi, Zibo gerçek pozuyla. Dekor kısmında boyadan küvete her şeyi değiştir, banyoda Zibo'yu yıka. ZC örnek veri.</p>
  </header>
  <div class="layout">
    <div class="stage" id="stage"><div id="art"></div><canvas id="fx"></canvas></div>
    <div class="panel">
      <div class="row">
        <div class="seg" id="rooms" role="group" aria-label="Oda"></div>
        <span class="coin"><span id="zc"></span> ZC</span>
      </div>
      <div class="seg" id="modes" role="group" aria-label="Mod"></div>
      <div id="body" class="panel"></div>
    </div>
  </div>
</div>

const FLOOR = 800;
function mix(hex, amt) {
  const n = parseInt(hex.slice(1), 16), t = amt > 0 ? 255 : 0, a = Math.abs(amt);
  const f = (v) => Math.round(v + (t - v) * a).toString(16).padStart(2, '0');
  return '#' + f((n >> 16) & 255) + f((n >> 8) & 255) + f(n & 255);
}
let defs = [], uid = 0;
function grad(a, b, horizontal) {
  const id = 'g' + ++uid;
  defs.push(`<linearGradient id="${id}" x1="0" y1="0" x2="${horizontal ? 1 : 0}" y2="${horizontal ? 0 : 1}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`);
  return `url(#${id})`;
}
function pat(body, w, h) { const id = 'p' + ++uid; defs.push(`<pattern id="${id}" width="${w}" height="${h}" patternUnits="userSpaceOnUse">${body}</pattern>`); return `url(#${id})`; }
const CHROME = () => grad('#FFFFFF', '#8E96A3');
function shine(x, y, w, h, r, o = .35) { return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="#fff" opacity="${o}"/>`; }
function handle(x, y, w, h) { return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(w, h) / 2}" fill="${CHROME()}" stroke="#6E7682" stroke-width="2"/>`; }
function feet(a, b, y) { return `<rect x="${a}" y="${y}" width="26" height="20" rx="8" fill="#5E5043"/><rect x="${b}" y="${y}" width="26" height="20" rx="8" fill="#5E5043"/>`; }
function shadow(cx, cy, rx) { return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="16" fill="#3A1F0A" opacity=".26" filter="url(#soft)"/>`; }

  const foamTop = caring && bath.phase !== 'temiz' && bath.phase !== 'islak'
    ? Array.from({ length: 11 }, (_, i) => `<circle cx="${70 + i * 40}" cy="${592 - (i % 2) * 10}" r="${26 + (i % 3) * 6}" fill="#fff" stroke="#CDEBF7" stroke-width="3"/>`).join('') : '';
  const duck = `<g transform="translate(418 538)"><ellipse cx="34" cy="40" rx="34" ry="22" fill="${grad('#FFE36B', '#F5B82E')}"/><circle cx="52" cy="16" r="18" fill="${grad('#FFE96F', '#F7BE31')}"/><path d="M66 16l20 4-20 6z" fill="#FF8A3D"/><circle cx="56" cy="12" r="3.5" fill="#14110C"/></g>`;
  return wrapSvg(`
  <rect width="900" height="${FLOOR}" fill="${grad(mix(wall, .2), mix(wall, -.05))}"/>
  <path d="M600 0h300v380z" fill="#fff" opacity=".2"/>
  <rect y="430" width="900" height="${FLOOR - 430}" fill="${tiles}"/><rect y="420" width="900" height="18" rx="6" fill="${grad('#FFFFFF', '#D5DEE3')}"/>
  <g transform="translate(690 150)"><circle r="82" fill="${grad('#FFFFFF', '#CBD5DC')}"/><circle r="64" fill="${grad('#8FD6F5', '#E2F6FC')}"/><circle cx="-18" cy="-14" r="16" fill="#fff" opacity=".7"/><circle cx="22" cy="20" r="9" fill="#fff" opacity=".6"/><rect x="-64" y="-4" width="128" height="8" fill="#F1F4F6"/></g>
  <g><rect x="150" y="0" width="16" height="250" fill="${CHROME()}"/><path d="M110 250h96l-14 34h-68z" fill="${CHROME()}" stroke="#7D8590" stroke-width="2"/>${[126, 146, 166, 186].map((x) => `<circle cx="${x}" cy="292" r="4" fill="#7D8590"/>`).join('')}</g>
  ${drawItem('havlu', 300, 250)}
  <g transform="translate(240 470)"><rect x="0" y="54" width="170" height="14" rx="7" fill="${grad('#FFFFFF', '#C7D0D6')}"/><rect x="14" y="8" width="34" height="48" rx="10" fill="${grad('#FF9FB6', '#E76F8F')}"/><rect x="22" y="0" width="18" height="12" rx="4" fill="#fff"/><rect x="62" y="18" width="30" height="38" rx="10" fill="${grad('#8FE3C2', '#4DBB91')}"/><rect x="104" y="12" width="40" height="44" rx="18" fill="${grad('#FFE07A', '#F2B731')}"/></g>
  ${drawItem('ayna', 640, 240)}
  <rect y="${FLOOR - 26}" width="900" height="26" fill="${grad('#FFFFFF', '#D5DEE3')}"/>
  <rect y="${FLOOR}" width="900" height="400" fill="${floorFill(z)}"/><rect y="${FLOOR}" width="900" height="400" fill="${grad('#00000020', '#00000000')}"/>
  ${shadow(270, 842, 230)}${shadow(720, 842, 90)}${drawItem('lavabo', 620, 540)}
  <ellipse cx="610" cy="1100" rx="200" ry="44" fill="${grad('#FFB7C8', '#F58CA8')}"/><ellipse cx="610" cy="1092" rx="176" ry="32" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="12 10" opacity=".7"/>
  ${caring ? `${zibo(pose, 120, 330, 430)}${tub}${foamTop}${duck}` : `${tub}${duck}<ellipse cx="610" cy="1112" rx="150" ry="20" fill="#3A1F0A" opacity=".28" filter="url(#soft)"/>${zibo('happy', 450, 640, 470)}`}`, "Zibo'nun banyosu");
}

/* EFEKT TUVALİ: köpük, baloncuk, kir, duş */
const fx = document.getElementById('fx'), ctx = fx.getContext('2d');
let raf = 0;
function sizeFx() { const r = fx.getBoundingClientRect(), d = window.devicePixelRatio || 1; fx.width = Math.round(r.width * d); fx.height = Math.round(r.height * d); }
function vb(e) { const r = fx.getBoundingClientRect(); return { x: (e.clientX - r.left) * 900 / r.width, y: (e.clientY - r.top) * 1200 / r.height }; }
function inZibo(p) { return p.x > 130 && p.x < 450 && p.y > 340 && p.y < 640; }
fx.addEventListener('pointerdown', (e) => { if (bath.phase !== 'kirli' && bath.phase !== 'kopuk') return; bath.pressed = true; fx.setPointerCapture(e.pointerId); scrub(vb(e)); });
fx.addEventListener('pointermove', (e) => { bath.soap = vb(e); if (bath.pressed) scrub(bath.soap); });
fx.addEventListener('pointerup', () => { bath.pressed = false; });
fx.addEventListener('pointerleave', () => { bath.soap = null; bath.pressed = false; });
function scrub(p) {
  if (!inZibo(p)) return;
  if (bath.phase === 'kirli') bath.phase = 'kopuk';
  if (bath.foams.length < 260) bath.foams.push({ x: p.x + (Math.random() - .5) * 40, y: p.y + (Math.random() - .5) * 40, r: 12 + Math.random() * 18, a: 1 });
  if (Math.random() < .5) bath.bubbles.push({ x: p.x, y: p.y, r: 6 + Math.random() * 16, vy: 1.2 + Math.random() * 1.8, w: Math.random() * 6, a: 1 });
  for (const s of bath.spots) if (Math.hypot(s.x - p.x, s.y - p.y) < 75) s.a = Math.max(0, s.a - .07);
  panelUpdate();
}
function tick() {
  if (!(room === 'banyo' && mode === 'bakim')) { raf = 0; ctx.clearRect(0, 0, fx.width, fx.height); return; }
  const k = fx.width / 900;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.clearRect(0, 0, 900, 1200);
  for (const s of bath.spots) {
    if (s.a <= 0) continue;
    ctx.fillStyle = `rgba(110,72,40,${.62 * s.a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.arc(s.x + s.r * .6, s.y + s.r * .3, s.r * .6, 0, 7); ctx.arc(s.x - s.r * .5, s.y + s.r * .4, s.r * .5, 0, 7); ctx.fill();
  }
  if (bath.shower > 0) {
    bath.shower--;
    for (let i = 0; i < 6; i++) bath.drops.push({ x: 120 + Math.random() * 80 + (Math.random() - .5) * 120, y: 296, v: 9 + Math.random() * 6 });
    for (const f of bath.foams) f.a -= .018;
    for (const s of bath.spots) s.a = Math.max(0, s.a - .03);
    if (bath.shower === 0) { bath.phase = 'islak'; draw(); }
  }
  bath.foams = bath.foams.filter((f) => f.a > 0);
  for (const f of bath.foams) {
    ctx.globalAlpha = Math.min(1, f.a);
    ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#CDEBF7'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill(); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  bath.bubbles = bath.bubbles.filter((b) => b.a > 0 && b.y > -40);
  for (const b of bath.bubbles) {
    b.y -= b.vy; b.x += Math.sin(b.y / 20 + b.w) * .8; b.a -= .006;
    ctx.globalAlpha = Math.max(0, b.a);
    ctx.strokeStyle = '#7CC8F0'; ctx.lineWidth = 2.5; ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x - b.r * .35, b.y - b.r * .35, b.r * .25, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  bath.drops = bath.drops.filter((d) => d.y < 760);
  ctx.strokeStyle = '#5BB8E8'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (const d of bath.drops) { d.y += d.v; ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x, d.y + 16); ctx.stroke(); }
  bath.sparks = bath.sparks.filter((s) => s.a > 0);
  for (const s of bath.sparks) {
    s.a -= .015; s.y -= .6;
    ctx.globalAlpha = Math.max(0, s.a); ctx.fillStyle = '#FFD64A';
    ctx.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? s.r * .4 : s.r, t = i * Math.PI / 4; ctx.lineTo(s.x + Math.cos(t) * r, s.y + Math.sin(t) * r); } ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (bath.soap && (bath.phase === 'kirli' || bath.phase === 'kopuk')) {
    const { x, y } = bath.soap;
    ctx.fillStyle = '#FF9FBF'; ctx.strokeStyle = '#E2668F'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.roundRect(x - 38, y - 24, 76, 48, 18); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.roundRect(x - 26, y - 16, 34, 9, 4); ctx.fill();
  }
  raf = requestAnimationFrame(tick);
}

/* ARAYÜZ */
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function segInto(host, list, cur, on) {
  host.replaceChildren();
  for (const [k, t] of list) { const b = el('button', '', t); b.setAttribute('aria-pressed', String(k === cur)); b.onclick = () => on(k); host.append(b); }
}
function thumb(it) { defs = []; const b = DRAW[it[2]](it[3]); return `<svg viewBox="${VB[it[2]]}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>${defs.join('')}</defs>${b}</svg>`; }
function tileSvg(kind, it) {
  defs = [];
  let fill;
  if (kind === 'wall') { const line = mix('#FFE7B0', -.14); fill = it[0] === 'duz' ? '#FFE7B0' : pat(`<rect width="80" height="80" fill="#FFE7B0"/>${WALLS[it[0]](line)}`, 80, 80); }
  else if (kind === 'tile') { const [w, h, f] = TILES[it[2]]; fill = pat(f(it[3], it[4]), w, h); }
  else { const [w, h, f] = FLOORS[it[2]]; fill = pat(f(it[3], it[4]), w, h); }
  return `<svg viewBox="0 0 160 160" aria-hidden="true"><defs>${defs.join('')}</defs><rect width="160" height="160" fill="${fill}"/></svg>`;
}
function panelUpdate() {
  const m = document.getElementById('meter'); if (m) m.style.width = cleanLevel() + '%';
  const steps = document.getElementById('steps'); if (!steps) return;
  const order = ['kirli', 'kopuk', 'islak', 'temiz'], idx = order.indexOf(bath.phase), avg = bath.spots.reduce((n, s) => n + s.a, 0) / bath.spots.length;
  const st = [idx > 1 || (idx === 1 && avg < .25), idx >= 2, idx >= 3];
  [...steps.children].forEach((li, i) => { li.className = st[i] ? 'done' : (st.indexOf(false) === i ? 'now' : ''); });
  document.getElementById('dus').disabled = !(bath.phase === 'kopuk' && avg < .25);
  document.getElementById('havlu').disabled = bath.phase !== 'islak';
}
function care(host) {
  const box = el('div', 'care');
  box.append(el('h3', '', bath.phase === 'temiz' ? 'Zibo tertemiz!' : 'Zibo kirlenmiş, yıkayalım'));
  const meter = el('div', 'meter'), fill = el('i'); fill.id = 'meter'; meter.append(fill);
  const lab = el('div', 'row'); lab.append(el('span', '', 'Temizlik')); box.append(lab, meter);
  const steps = el('ol', 'steps'); steps.id = 'steps';
  for (const [n, t] of [[1, 'Sabunu Zibo\'nun üstünde gezdir, köpürt'], [2, 'Duşu aç, köpükleri durula'], [3, 'Havluyla kurula']]) { const li = el('li'); li.append(el('b', '', n), t); steps.append(li); }
  box.append(steps);
  const btns = el('div', 'btns');
  const dus = el('button', 'btn', 'Duşu aç'); dus.id = 'dus';
  dus.onclick = () => { bath.shower = 110; dus.disabled = true; };
  const havlu = el('button', 'btn', 'Havluyla kurula'); havlu.id = 'havlu';
  havlu.onclick = () => { bath.phase = 'temiz'; bath.drops = []; for (let i = 0; i < 14; i++) bath.sparks.push({ x: 150 + Math.random() * 280, y: 360 + Math.random() * 240, r: 10 + Math.random() * 12, a: 1 + Math.random() * .5 }); draw(); };
  const again = el('button', 'btn alt', 'Tekrar kirlet (deneme)');
  again.onclick = () => { dirty(); draw(); };
  btns.append(dus, havlu, again);
  box.append(btns, el('p', 'note', 'Gerçek uygulamada Zibo zamanla kirlenir, temizlik göstergesi yavaşça düşer. Sabun ve köpük çeşitleri ZC ile satılabilir.'));
  host.append(box);
  panelUpdate();
}
function shop(host) {
  const bill = unpaid(), sum = bill.reduce((n, x) => n + x[1], 0);
  const buy = el('button', 'btn', bill.length ? `Odadakileri al · ${sum} ZC` : 'Oda tamam');
  buy.disabled = !bill.length;
  buy.onclick = () => { if (sum > zc) { buy.textContent = 'Yeterli ZC yok'; return; } zc -= sum; bill.forEach(([c]) => owned.add(`${room}:${c}:${R().eq[c]}`)); draw(); };
  const tabs = el('div', 'tabs'); tabs.setAttribute('role', 'group'); tabs.setAttribute('aria-label', 'Kategori');
  for (const [k, v] of Object.entries(R().cat)) { const b = el('button', '', v.n); b.setAttribute('aria-pressed', String(k === cat)); b.onclick = () => { cat = k; draw(); }; tabs.append(b); }
  const shelf = el('div', 'shelf'), C = R().cat[cat];
  for (const it of C.items) {
    const b = el('button', 'opt'); b.setAttribute('aria-pressed', String(R().eq[cat] === it[0]));
    const art = el('div');
    if (C.k === 'swatch') { art.className = 'swatch'; art.style.background = it[2]; }
    else if (C.k === 'draw') art.innerHTML = thumb(it);
    else { art.className = 'tile'; art.innerHTML = tileSvg(C.k, it); }
    const has = owned.has(`${room}:${cat}:${it[0]}`), s = el('small', has ? 'own' : '', has ? 'Sende var' : `${price(it)} ZC`);
    b.append(art, it[1], s);
    b.onclick = () => { R().eq[cat] = it[0]; draw(); };
    shelf.append(b);
  }
  host.append(buy, tabs, shelf, el('p', 'note', 'Önce odada dene, sonra satın al. Aynı ürünün yeni rengi yeni çizim istemez.'));
}
function draw() {
  document.getElementById('art').innerHTML = room === 'banyo' ? bathSvg() : kitchenSvg();
  document.getElementById('zc').textContent = zc;
  segInto(document.getElementById('rooms'), Object.entries(ROOMS).map(([k, v]) => [k, v.n]), room, (k) => { room = k; cat = 'boya'; mode = 'dekor'; draw(); });
  const modes = document.getElementById('modes');
  modes.hidden = room !== 'banyo';
  segInto(modes, [['dekor', 'Dekor'], ['bakim', 'Banyo yap']], mode, (k) => { mode = k; draw(); });
  const body = document.getElementById('body'); body.replaceChildren();
  const caring = room === 'banyo' && mode === 'bakim';
  fx.classList.toggle('on', caring);
  if (caring) care(body); else shop(body);
  sizeFx();
  if (caring && !raf) raf = requestAnimationFrame(tick);
  if (!caring) ctx.clearRect(0, 0, fx.width, fx.height);
}
window.addEventListener('resize', sizeFx);
draw();
</script>
