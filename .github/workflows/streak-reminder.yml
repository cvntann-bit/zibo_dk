name: Streak Hatırlatması Bildirimi

on:
  # 2026 GÜNCELLEMESİ — SAATTE BİR çalışıp her kullanıcının KENDİ yerel
  # saati 20:00 olduğunda gönderir (bkz. notification-scripts/src/
  # streakReminder.js'teki TARGET_LOCAL_HOURS — daha önce sabit Europe/
  # Istanbul saatiydi, bir test kullanıcısının farklı saat diliminde
  # bildirimi gece yarısına yakın alması üzerine değiştirildi). Dakika
  # bilerek :14 (:00/:15/:30/:45 DEĞİL) — GitHub'ın schedule gecikmeleri
  # özellikle o dakikalarda yoğunlaşıyor (bkz. daily-motivation.yml'deki
  # gerçek olayla doğrulanmış not); diğer bildirim workflow'larıyla aynı
  # saatte çakışmasın diye de ayrı bir dakika seçildi.
  schedule:
    - cron: '14 * * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run streak-reminder
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
