name: Streak Hatırlatması Bildirimi

on:
  # 20:00 Europe/Istanbul = 17:00 UTC.
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run streak-reminder
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
