name: Geri Kazanma Bildirimi

on:
  # 2026 GÜNCELLEMESİ — SAATTE BİR çalışıp her kullanıcının KENDİ yerel
  # saati 11:00 olduğunda kontrol eder (bkz. notification-scripts/src/
  # reEngagement.js'teki TARGET_LOCAL_HOURS — daha önce sabit Europe/
  # Istanbul saatiydi). Dakika bilerek :42 (:00/:15/:30/:45 DEĞİL) —
  # GitHub'ın schedule gecikmeleri özellikle o dakikalarda yoğunlaşıyor
  # (bkz. daily-motivation.yml'deki gerçek olayla doğrulanmış not); diğer
  # bildirim workflow'larıyla aynı saatte çakışmasın diye de ayrı bir
  # dakika seçildi.
  schedule:
    - cron: '42 * * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run re-engagement
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
