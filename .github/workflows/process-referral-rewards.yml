name: Davet Et Ödüllerini İşle

# Davet Et (referral) sistemi (bkz. CLAUDE.md "Davet Et" bölümü VE
# notification-scripts/src/processReferralRewards.js dokümantasyonu) —
# istemcilerin `referralRedemptions` koleksiyonuna bıraktığı bekleyen
# davet kayıtlarını tarayıp HER İKİ tarafa (davet eden + davet edilen)
# Admin SDK ile (rules'u atlayarak, GÜVENİLİR taraf olarak) coin kredisi
# yazar. Diğer bildirim workflow'larıyla AYNI saatlik cron deseni — dakika
# bilerek :28 (:00/:15/:30/:45 DEĞİL, GitHub'ın schedule gecikmelerinin
# yoğunlaştığı dakikalar; diğer 5 workflow'la da çakışmasın diye ayrı).
#
# `cleanupStaleAnonymousUsers.js`'in AKSİNE bu betiğin DRY_RUN varsayılanı
# `false` — betik EKLEYİCİ/DÜŞÜK RİSKLİ (yalnızca coin bakiyesi ARTIRIYOR)
# ve gerçek otomasyonla çalışması amaçlanıyor. `workflow_dispatch`'teki
# `dry_run` girdisi yalnızca kullanıcının elle bir sağlık kontrolü yapmak
# istediği durumlar için var.

on:
  schedule:
    - cron: '28 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true: yalnızca ne kredileneceğini logla (gerçekte kredilemez). false: GERÇEKTEN kredile (varsayılan).'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  process:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run process-referral-rewards
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
