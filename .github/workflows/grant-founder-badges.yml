name: Kurucu Üye Rozetlerini Ver

# BİR KERELİK bakım işi (bkz. notification-scripts/src/grantFounderBadges.js
# dokümantasyonu VE CLAUDE.md "Kurucu Üye" bölümü) — ilk N (varsayılan 500)
# kayıt olan kullanıcıya özel, satın alınamayan bir "Kurucu Üye" rozeti
# ver. `cleanup-stale-anonymous-users.yml` ile AYNI desen — yalnızca elle
# (`workflow_dispatch`) tetiklenir, `schedule:` YOK (kullanıcı "ilk 500'ü
# kilitleme" kararını kendisi verip elle bir kez tetikleyecek).
#
# GÜVENLİK: `dry_run` girdisi VARSAYILAN `true` — önce çalıştırıp Actions
# log'unda KİME rozet verileceğini gözden geçirin, sonra emin olunca
# `dry_run`ı `false` yaparak TEKRAR tetikleyin. Betik idempotent — zaten
# rozeti olan kullanıcılar tekrar tekrar çalıştırmada atlanır, bu yüzden
# birkaç kez dry-run ile deneme yapmak güvenli.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true: yalnızca kime rozet verileceğini logla (varsayılan, güvenli). false: GERÇEKTEN ver.'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      founder_count:
        description: 'İlk kaç kullanıcı "Kurucu Üye" sayılsın.'
        required: false
        default: '500'
        type: string

jobs:
  grant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run grant-founder-badges
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: ${{ inputs.dry_run }}
          FOUNDER_COUNT: ${{ inputs.founder_count }}
