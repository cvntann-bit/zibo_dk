name: Günlük Motivasyon Bildirimi

on:
  # 2026 GÜNCELLEMESİ — kullanıcı dünyanın her yerinden test kullanıcıları
  # katılınca (bir Kolombiya kullanıcısı sabah 4'te bildirim aldığını
  # bildirdi) TASARIM DEĞİŞTİ: artık SABİT dört Istanbul saati YOK, bunun
  # yerine SAATTE BİR çalışıp her kullanıcının KENDİ yerel saatine göre
  # filtreleme yapan TEK bir tetikleyici var (bkz. notification-scripts/
  # src/dailyMotivation.js'teki TARGET_LOCAL_HOURS = [9, 12, 16, 20]).
  # Dakika BİLEREK :00/:15/:30/:45 DIŞINDA (:07) — GitHub'ın kendi
  # dokümantasyonu bu dakikaları "yoğun" olarak işaretliyor, gerçek bir
  # olayla (bkz. git geçmişi) doğrulanmış bir gecikme riski.
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run daily-motivation
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
