name: Günlük Motivasyon Bildirimi

on:
  # GÜNDE TEK tetikleme, 09:07 Europe/Istanbul (=06:07 UTC) — BİLEREK
  # :00/:15/:30/:45 DIŞINDA bir dakika (GitHub'ın kendi dokümantasyonu bu
  # dakikaları "yoğun" olarak işaretliyor, gecikme riski en yüksek).
  # Önceki tasarım (09:00-10:45 arası 15dk'da bir, 8 tetikleme) gerçek bir
  # olayla test edildi: GitHub o gün 8 tetiklemeden yalnızca 1'ini
  # gerçekleştirdi, 22 dakika GECİKMEYLE — script'in pencere kontrolü
  # yüzünden hiç gönderim yapılmadı (bkz. notification-scripts/src/
  # dailyMotivation.js'deki tam açıklama). Tek, yoğun-olmayan bir
  # tetikleme çok daha güvenilir.
  schedule:
    - cron: '7 6 * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run daily-motivation
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
