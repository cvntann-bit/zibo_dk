<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sorun çözüm reklamı (v04)</title>
<!--
  v04 — Sorun → çözüm reklamı. Müzik: From Sad to Bright — 109,98 bpm → ölçü 2,1822 sn, ilk ölçü başı 0,44 sn,
  sakin→neşeli geçiş şarkının 9,17. sn'sinde (4. ölçü başı). Video şarkının 2. ölçüsünden (4,80 sn) başlar:
  ölçü 0–1 = SORUN (gri, yağmur, Zibo üzgün) | ölçü 2 = DÜŞÜŞ (daire açılır, renk patlar) |
  ölçü 3–5 = ÇÖZÜM (hedefler, seri/rozet, oyun+coin) | ölçü 6 = kapanış. 7 ölçü = 15,28 sn.
  Ortak yardımcılar: ../kit.js, ../kit.css. Ses kurgusu: sound.py (zamanlar buradakiyle aynı).
-->
<link rel="stylesheet" href="../kit.css">
<style>
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(20,17,12,.07) 24%,transparent 26%);background-size:30px 30px}
.rays{position:absolute;left:50%;top:50%;width:3000px;height:3000px;margin:-1500px 0 0 -1500px;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.26) 0 9deg,transparent 9deg 18deg)}
.panel{background:#fff;border:7px solid var(--outline);border-radius:40px;box-shadow:12px 12px 0 var(--outline);
  padding:36px 40px;display:flex;flex-direction:column;gap:26px;box-sizing:border-box;width:720px}
.panel.sad{background:#E9ECF1}
.row{display:flex;align-items:center;gap:26px}
.box{width:76px;height:76px;border:6px solid var(--outline);border-radius:20px;box-sizing:border-box;flex:none;
  display:flex;align-items:center;justify-content:center;background:#fff}
.row b{font-size:52px;font-weight:800;white-space:nowrap;line-height:1}
.sad .row b{color:#5A6270}
.drop{width:5px;height:30px;border-radius:3px;background:rgba(40,55,90,.4)}
.conf{border:3px solid var(--outline);box-sizing:border-box}
.icon{border:7px solid var(--outline);border-radius:23%;box-shadow:10px 10px 0 var(--outline);box-sizing:border-box}
.thumb img{width:100%;height:100%}
</style>
</head>
<body>
<div id="stage"></div>
<script src="../kit.js"></script>
<script>
const BAR=240/109.98,NB=7,END=NB*BAR;
const S=Array.from({length:NB+1},(_,i)=>i*BAR);
const TX={
 tr:{h0:['Hedeflerini hep','yarıda mı bırakıyorsun?'],h1:['“Yarın başlarım”','diyip duruyor musun?'],
  goals:['Kitap oku','Yürüyüşe çık','Su iç'],h2:['Çözüm:','*Zibo!*'],tag:'Dijital kankan cebinde!',
  h3:['Hedeflerini','*tek* *tek* bitir'],h4:['*Serini* büyüt,','rozetleri topla'],streak:n=>`Seri: ${n} gün`,
  h5:['Oyna, *★* *topla,*','Zibo Coin kazan!'],exS:'★ → ZC',
  ctag:'Dijital Kanka',btn:'ÜCRETSİZ İNDİR',play:"Google Play'de"},
 es:{h0:['¿Siempre dejas tus','metas a medias?'],h1:['¿“Mañana empiezo”','y nunca llega?'],
  goals:['Leer','Salir a caminar','Beber agua'],h2:['La solución:','*¡Zibo!*'],tag:'¡Tu amigo digital de bolsillo!',
  h3:['Cumple tus metas','*una* *a* *una*'],h4:['Sube tu *racha,*','colecciona insignias'],streak:n=>`Racha: ${n} días`,
  h5:['Juega, *junta* *★,*','gana Zibo Coins'],exS:'★ → ZC',
  ctag:'Tu amigo digital',btn:'DESCARGA GRATIS',play:'en Google Play'},
 en:{h0:['Always leaving your','goals half-done?'],h1:['“I’ll start tomorrow”','never happens?'],
  goals:['Read','Go for a walk','Drink water'],h2:['The fix:','*Zibo!*'],tag:'Your pocket-sized digital buddy!',
  h3:['Finish your goals','*one* *by* *one*'],h4:['Grow your *streak,*','collect badges'],streak:n=>`Streak: ${n} days`,
  h5:['Play, *earn* *★,*','win Zibo Coins'],exS:'★ → ZC',
  ctag:'Your digital buddy',btn:'FREE DOWNLOAD',play:'on Google Play'}};
const X=TX[LANG]||TX.tr;

// ---------- yerleşim ----------
const L=V?{
  sz:[540,1540,640],cloud:[540,1170,1.7],sh:[540,300,104],sp:[540,860],
  zt:{2:[540,1500,780],3:[540,1600,560],4:[540,1640,520],5:[540,1660,480],6:[540,1650,560]},
  h2:[540,620,250],tag:[540,1000,60],hp:[540,320,118],
  pan:[540,860],coin:[800,1170,210],zc:[540,1180,70],
  bc:[540,900,420],bl:[230,1110,260],br:[850,1110,260],cnt:[540,1290,70],
  th:[[230,860],[540,780],[850,860]],ths:290,c5:[540,1160,380],ex:[540,1420,80],
  ci:[540,440,330],cl:[540,770,560],ct:[540,965,66],cb:[540,1180,76],cp:[540,1325,42]}
 :{
  sz:[420,660,820],cloud:[420,130,1.6],sh:[1310,250,88],sp:[1310,640],
  zt:{2:[420,640,840],3:[420,640,840],4:[420,640,840],5:[420,640,840],6:[520,585,830]},
  h2:[1310,380,230],tag:[1310,780,58],hp:[1310,200,96],
  pan:[1310,600],coin:[1640,800,140],zc:[1310,860,64],
  bc:[1310,610,360],bl:[1000,720,230],br:[1620,720,230],cnt:[1310,900,64],
  th:[[1050,560],[1310,500],[1570,560]],ths:250,c5:[1310,790,250],ex:[1310,960,70],
  ci:[1290,225,240],cl:[1290,470,520],ct:[1290,640,60],cb:[1290,810,72],cp:[1290,935,40]};
const ZX=V?540:420,ZY=V?1500:640;   // dairesel açılışın merkezi = mutlu Zibo

// ================= SORUN katmanı =================
const sad=mk(stage,'div','full');
const sbg=mk(sad,'div','full');sbg.style.background='linear-gradient(#7D8797,#BFC6D1)';mk(sad,'div','dots');
const R0=rng(5),drops=Array.from({length:46},()=>{const e=mk(sad,'div','o drop');return{e,x:R0()*W,v:1000+R0()*500,ph:R0()*2000}});
const CLOUD='<svg width="300" height="150" viewBox="0 0 300 150"><path d="M60,130 C10,130 5,80 50,72 C45,30 110,12 135,48 C160,15 235,28 228,75 C285,72 292,130 240,130Z" fill="#8A93A3" stroke="#14110C" stroke-width="8" stroke-linejoin="round"/></svg>';
const cloud=mk(sad,'div','o',CLOUD);
const szb=mk(sad,'div','o shadow');szb.style.width=L.sz[2]*.6+'px';szb.style.height='56px';
const sz=img(sad,'zibo_df_pose1.webp',L.sz[2]);sz.style.filter='grayscale(.85) brightness(.9)';
const sh0=headline(sad,X.h0,L.sh[2]);fit(sh0.el,V?930:1100);
const sh1=headline(sad,X.h1,L.sh[2]);fit(sh1.el,V?930:1100);
const spn=mk(sad,'div','o panel sad');
const srows=X.goals.map(g=>{const r=mk(spn,'div','row'),bx=mk(r,'div','box',
  '<svg viewBox="0 0 24 24" width="56"><path d="M5 5L19 19M19 5L5 19" stroke="#C0392B" stroke-width="4.5" stroke-linecap="round" fill="none"/></svg>');
  return{x:bx.firstChild,lab:fit(mk(r,'b',null,g),520)}});
function sadFrame(t){
  if(t>=S[2]+.6){sad.style.display='none';return}sad.style.display='block';
  drops.forEach(d=>put(d.e,d.x,((t*d.v+d.ph)%(H+120))-60,1,14,.9));
  put(cloud,L.cloud[0],L.cloud[1]+Math.sin(t*1.4)*8,L.cloud[2],0);
  put(szb,L.sz[0],L.sz[1]+L.sz[2]/2-14);
  put(sz,L.sz[0],L.sz[1]+Math.sin(t*1.6)*5,1,Math.sin(t*1.3)*2.4);
  const d=BAR;
  put(sh0.el,L.sh[0],L.sh[1],io(t,.2,d),-2);popWords(sh0,t,.3,.16);
  put(sh1.el,L.sh[0],L.sh[1],io(t-S[1],.1,d),2);popWords(sh1,t-S[1],.2,.16);
  put(spn,L.sp[0],L.sp[1],io(t,.8,2*d+.6)*(t>S[2]-.3?1-prog(t,S[2]-.3,.3):1),-1.5);
  srows.forEach((r,i)=>{const p=prog(t-S[1],.5456*(i+1),.25);r.x.style.transform=`scale(${p<=0?0:eBack(p)})`;r.lab.style.opacity=lerp(1,.55,p)})}

// ================= ÇÖZÜM katmanı =================
const happy=mk(stage,'div','full');
const hbg=mk(happy,'div','full'),rays=mk(happy,'div','rays');mk(happy,'div','dots');
const PALH={2:['#F3B23C','#FFE08A'],3:['#3FA9F5','#9ADBFF'],4:['#8E5BE6','#C3A4FF'],5:['#2FBF71','#9BE7B5'],6:['#FFF4DE','#FFE3A6']};
const hzb=mk(happy,'div','o shadow');hzb.style.width='500px';hzb.style.height='56px';
const hz=img(happy,'zibo_df_pose3.webp',800),hz2=img(happy,'zibo_df_pose4.webp',800);
// bar 2
const h2=headline(happy,X.h2,L.h2[2]);fit(h2.el,V?980:1000);
const tag=fit(mk(happy,'div','o stk',X.tag),V?980:860);tag.style.fontSize=L.tag[2]+'px';
const STAR=c=>`<svg width="90" height="90" viewBox="-60 -60 120 120"><path d="M0,-50 C6,-16 16,-6 50,0 C16,6 6,16 0,50 C-6,16 -16,6 -50,0 C-16,-6 -6,-16 0,-50Z" fill="${c}" stroke="#14110C" stroke-width="7" stroke-linejoin="round"/></svg>`;
const stars=(V?[[110,520],[960,560],[90,1000],[980,1020],[300,300],[780,330]]:[[1000,250],[1720,260],[980,760],[1750,760],[1150,120],[1600,100]])
  .map((p,i)=>({e:mk(happy,'div','o',STAR(i%2?'#F3B23C':'#fff')),p}));
// bar 3
const hh3=headline(happy,X.h3,L.hp[2]);fit(hh3.el,V?980:1000);
const hpn=mk(happy,'div','o panel');
const hrows=X.goals.map(g=>{const r=mk(hpn,'div','row'),bx=mk(r,'div','box',
  '<svg viewBox="0 0 24 24" width="56"><path d="M4 12.5l5.5 5.5L20 6.5" fill="none" stroke="#14110C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>');
  return{bx,chk:bx.firstChild,lab:fit(mk(r,'b',null,g),520)}});
const hcoin=img(happy,'zibo_coin.webp',L.coin[2]);
const hzc=mk(happy,'div','o stk','+30 ZC');hzc.style.fontSize=L.zc[2]+'px';
// bar 4
const hh4=headline(happy,X.h4,L.hp[2]);fit(hh4.el,V?980:1000);
const bdg=[['bir_hafta_seri_rozet.webp',L.bc],['su_kahramani_rozet.webp',L.bl],['demir_irade_rozet.webp',L.br]].map(b=>({e:img(happy,b[0],b[1][2]),p:b[1]}));
const cnt=mk(happy,'div','o stk','');cnt.style.fontSize=L.cnt[2]+'px';
// bar 5
const hh5=headline(happy,X.h5,L.hp[2]);fit(hh5.el,V?980:1000);
const gth=['kule','yakala','2048'].map(g=>{const t=mk(happy,'div','o thumb');t.style.width=t.style.height=L.ths+'px';
  mk(t,'img').src=IMG+'game_'+g+'_thumb.webp';return t});
const c5=img(happy,'zibo_coin.webp',L.c5[2]);
const exs=mk(happy,'div','o stk',X.exS);exs.style.fontSize=L.ex[2]+'px';exs.style.background='#fff';
// bar 6 kapanış
const R1=rng(99),cols=['#F3B23C','#23408E','#8FD3FF','#E8553D','#fff','#F6D488'],conf=[];
for(let i=0;i<80;i++){const e=mk(happy,'div','o conf'),w=18+R1()*26;
  e.style.width=w+'px';e.style.height=(i%3?w*.5:w)+'px';e.style.background=cols[i%cols.length];if(i%4==0)e.style.borderRadius='50%';
  const a=-Math.PI/2+(R1()-.5)*2.4,v=900+R1()*1500;conf.push({e,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:R1()*360,rv:(R1()-.5)*900})}
const cic=img(happy,'zibo_app_icon.png',L.ci[2]);cic.classList.add('icon');
const clg=img(happy,'zibo_logo_new.webp',null,V?560:520);
const ctg=fit(mk(happy,'div','o sub',X.ctag),V?980:700);ctg.style.fontSize=L.ct[2]+'px';ctg.style.fontWeight=800;
const cbt=fit(mk(happy,'div','o stk',X.btn),900);cbt.style.fontSize=L.cb[2]+'px';
const cpl=mk(happy,'div','o sub',X.play);cpl.style.cssText+=`font-size:${L.cp[2]}px;font-family:Nunito;font-weight:900`;

const ztarget=i=>L.zt[Math.min(6,Math.max(2,i))];
function happyFrame(t){
  const i=Math.min(NB-1,Math.floor(t/BAR)),lt=t-S[i],d=BAR;
  if(t<S[2]){happy.style.visibility='hidden';return}happy.style.visibility='visible';
  // zemin
  const p=i>2?eInOut(prog(lt,0,.3)):1,A=PALH[Math.max(2,i-1)],B=PALH[i];
  hbg.style.background=`linear-gradient(${mix(A[0],B[0],p)},${mix(A[1],B[1],p)})`;rays.style.transform=`rotate(${t*(i%2?6:-6)}deg)`;
  // Zibo: hedef konuma yumuşak geçiş, düşüşte "pat" diye büyür
  const zp=i>2?eInOut(prog(lt,0,.4)):1,Za=ztarget(Math.max(2,i-1)),Zb=ztarget(i);
  const zx=lerp(Za[0],Zb[0],zp),zy=lerp(Za[1],Zb[1],zp),zh=lerp(Za[2],Zb[2],zp);
  const pop=t<S[2]+.6?eBack(prog(t,S[2],.5))*.35+.65:1,sc=zh/800*pop;
  const bob=Math.sin(t*3.2)*7,cta=i===6?prog(lt,0,.25):0;
  put(hz,zx,zy+bob,sc,Math.sin(t*2)*1.5,1-cta);put(hz2,zx,zy+bob,sc,Math.sin(t*2)*1.5,cta);
  put(hzb,zx,zy+zh/2-14,zh/800*pop*.95,0,i===6&&V?0:1);
  // --- ölçü 2: çözüm! ---
  const l2=t-S[2];
  put(h2.el,L.h2[0],L.h2[1],io(l2,.15,d),-3);popWords(h2,l2,.25,.2);
  put(tag,L.tag[0],L.tag[1],io(l2,.75,d),2);
  stars.forEach((s,k)=>put(s.e,s.p[0],s.p[1],io(l2,.3+k*.08,d)*(1+Math.sin(t*6+k)*.16),t*40+k*30));
  // --- ölçü 3: hedefler tek tek ---
  const l3=t-S[3];
  put(hh3.el,L.hp[0],L.hp[1],io(l3,.1,d),-2);popWords(hh3,l3,.2,.15);
  put(hpn,L.pan[0],L.pan[1],io(l3,.35,d),-1.5);
  hrows.forEach((r,k)=>{const q=prog(l3,.5456*(k+1),.25);r.bx.style.background=q>0?'#F3B23C':'#fff';
    r.chk.style.transform=`scale(${q<=0?0:eBack(q)})`});
  put(hcoin,L.coin[0],L.coin[1],io(l3,1.75,d),lerp(-40,8,eOut(prog(l3,1.75,.5))));
  put(hzc,L.zc[0],L.zc[1],io(l3,1.9,d),-4);
  // --- ölçü 4: seri + rozetler ---
  const l4=t-S[4],n=Math.max(1,Math.round(1+6*eOut(prog(l4,.5,1.5))));
  put(hh4.el,L.hp[0],L.hp[1],io(l4,.1,d),-2);popWords(hh4,l4,.2,.15);
  bdg.forEach((b,k)=>put(b.e,b.p[0],b.p[1]+Math.sin(t*2.6+k*2)*10,io(l4,.3+k*.17,d),lerp(-18,0,eOut(prog(l4,.3+k*.17,.5)))*(k?(k===1?-1:1):0)));
  cnt.textContent=X.streak(n);
  put(cnt,L.cnt[0],L.cnt[1],io(l4,.75,d)+Math.sin(Math.PI*prog(l4,1.95,.25))*.13,-2);
  // --- ölçü 5: oyun + coin ---
  const l5=t-S[5];
  put(hh5.el,L.hp[0],L.hp[1],io(l5,.1,d),-2);popWords(hh5,l5,.2,.15);
  gth.forEach((g,k)=>put(g,L.th[k][0],L.th[k][1]+Math.sin(t*3+k)*8,io(l5,.35+k*.13,d),(k-1)*7));
  put(c5,L.c5[0],L.c5[1]+Math.sin(t*3)*8,io(l5,.7,d),Math.sin(t*2)*3,1,Math.cos(lerp(0,4*Math.PI,eOut(prog(l5,.7,1.1)))));
  put(exs,L.ex[0],L.ex[1],io(l5,1.1,d),-3);
  // --- ölçü 6: kapanış ---
  const l6=t-S[6];
  conf.forEach(c=>{const tc=l6-.15;put(c.e,L.ci[0]+c.vx*tc*.9,L.ci[1]+c.vy*tc+1400*tc*tc,1,c.r+c.rv*tc,tc<0?0:clamp(2.6-tc))});
  put(cic,L.ci[0],L.ci[1],io(l6,.1,d+9),lerp(-18,-4,eOut(prog(l6,.1,.5))));
  put(clg,L.cl[0],L.cl[1],io(l6,.35,d+9),-2);
  put(ctg,L.ct[0],L.ct[1],io(l6,.7,d+9));
  put(cbt,L.cb[0],L.cb[1],io(l6,1.09,d+9)*(1+Math.sin(l6*6.5)*.035)+Math.sin(Math.PI*prog(l6,1.63,.3))*.1,-2);
  put(cpl,L.cp[0],L.cp[1],1,0,l6<0?0:eOut(prog(l6,1.4,.4)))}

// ================= düşüş: daire açılır + halka + beyaz parlama =================
const ring=mk(stage,'div','o');ring.style.cssText+='border:16px solid #14110C;border-radius:50%;box-sizing:border-box;display:none';
const flash=mk(stage,'div','full');flash.style.background='#fff';flash.style.opacity=0;flash.style.pointerEvents='none';
const MAXR=Math.hypot(W,H)+60;
function wipe(t){const p=prog(t,S[2],.45),r=eInOut(p)*MAXR;
  happy.style.clipPath=t<S[2]?'circle(0px at 50% 50%)':(p>=1?'none':`circle(${r}px at ${ZX}px ${ZY}px)`);
  if(p>0&&p<1){ring.style.display='block';ring.style.width=ring.style.height=(2*r+16)+'px';
    ring.style.transform=`translate(${ZX}px,${ZY}px) translate(-50%,-50%)`}else ring.style.display='none';
  flash.style.opacity=t>=S[2]?Math.max(0,1-(t-S[2])/.28)*.85:0}

boot(END,t=>{sadFrame(t);happyFrame(t);wipe(t)});
</script>
</body>
</html>
